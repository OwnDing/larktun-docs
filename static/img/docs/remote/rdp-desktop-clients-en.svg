<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" xml:lang="en-US" role="img" aria-labelledby="title desc">
  <title id="title">Windows mstsc and macOS Windows App Connection Illustration</title>
  <desc id="desc">Side-by-side UI illustration of connecting to a target PC's Larktun IP using Windows mstsc and macOS Windows App.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" class="t" font-size="27" font-weight="800">Connecting from Desktop Clients with a Larktun IP</text>
  <text x="600" y="84" text-anchor="middle" class="t muted" font-size="15">Make sure the Larktun Desktop Client shows Connected on your computer first (UI illustration)</text>

  <!-- Left: Windows mstsc -->
  <g filter="url(#sh)">
    <rect x="48" y="114" width="530" height="456" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="48" y="114" width="530" height="44" rx="16" fill="#f8fafc"/>
    <rect x="48" y="142" width="530" height="16" fill="#f8fafc"/>
    <line x1="48" y1="158" x2="578" y2="158" stroke="#e2e8f0"/>
    <rect x="68" y="127" width="18" height="18" rx="4" fill="#2563eb"/>
    <text x="96" y="141" class="t" font-size="14" font-weight="700">Remote Desktop Connection (Win + R → mstsc)</text>

    <rect x="48" y="158" width="530" height="58" fill="#1d4ed8"/>
    <text x="74" y="195" class="t" font-size="21" font-weight="750" style="fill:#ffffff">Remote Desktop Connection</text>
    <rect x="424" y="173" width="132" height="28" rx="14" fill="#ffffff" fill-opacity="0.18"/>
    <text x="490" y="192" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#e0f2fe">Windows Client</text>

    <rect x="70" y="232" width="76" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="108" y="252" text-anchor="middle" class="t" font-size="13" font-weight="700" style="fill:#1d4ed8">General</text>
    <text x="172" y="252" class="t muted" font-size="13">Display</text>
    <text x="238" y="252" class="t muted" font-size="13">Local Resources</text>
    <text x="356" y="252" class="t muted" font-size="13">Experience</text>

    <rect x="70" y="272" width="486" height="222" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="90" y="302" class="t" font-size="14" font-weight="700">Computer:</text>
    <rect x="190" y="282" width="346" height="34" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="204" y="304" class="m" font-size="15" font-weight="700" style="fill:#1d4ed8">100.64.0.10</text>
    <text x="190" y="332" class="t muted" font-size="11">Direct: 100.x.x.x · Subnet: 192.168.6.10 · Custom: IP:port</text>

    <text x="90" y="368" class="t" font-size="14" font-weight="700">User name:</text>
    <rect x="190" y="348" width="346" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="204" y="370" class="m" font-size="13.5" style="fill:#334155">alex (or MicrosoftAccount\email)</text>

    <rect x="190" y="398" width="18" height="18" rx="4" fill="#2563eb"/>
    <path d="M194 407 L197 410 L204 403" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="216" y="412" class="t" font-size="13">Allow me to save credentials</text>

    <rect x="90" y="432" width="446" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="106" y="459" class="t" font-size="12" style="fill:#1e40af">Tip: Click "Show Options" to enter username or save an .rdp shortcut file</text>

    <rect x="352" y="514" width="104" height="36" rx="8" fill="#2563eb"/>
    <text x="404" y="537" text-anchor="middle" class="t" font-size="14" font-weight="700" style="fill:#ffffff">Connect</text>
    <rect x="468" y="514" width="88" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="512" y="537" text-anchor="middle" class="t muted" font-size="14" font-weight="600">Cancel</text>
  </g>

  <!-- Right: macOS Windows App -->
  <g filter="url(#sh)">
    <rect x="622" y="114" width="530" height="456" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="622" y="114" width="530" height="44" rx="16" fill="#f8fafc"/>
    <rect x="622" y="142" width="530" height="16" fill="#f8fafc"/>
    <line x1="622" y1="158" x2="1152" y2="158" stroke="#e2e8f0"/>
    <circle cx="646" cy="136" r="6" fill="#fb7185"/>
    <circle cx="666" cy="136" r="6" fill="#fbbf24"/>
    <circle cx="686" cy="136" r="6" fill="#34d399"/>
    <text x="708" y="141" class="t" font-size="14" font-weight="700">Windows App (macOS · Add PC)</text>

    <rect x="622" y="158" width="530" height="58" fill="#0f172a"/>
    <text x="648" y="195" class="t" font-size="21" font-weight="750" style="fill:#ffffff">Add PC</text>
    <rect x="990" y="173" width="140" height="28" rx="14" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="1060" y="192" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#7dd3fc">macOS Client</text>

    <rect x="644" y="238" width="486" height="256" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

    <text x="664" y="268" class="t" font-size="13.5" font-weight="700">PC name:</text>
    <rect x="664" y="278" width="446" height="36" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="678" y="301" class="m" font-size="15" font-weight="700" style="fill:#1d4ed8">100.64.0.10</text>

    <text x="664" y="342" class="t" font-size="13.5" font-weight="700">User account:</text>
    <rect x="664" y="352" width="446" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="678" y="375" class="t" font-size="13" style="fill:#334155">Add User Account → enter Windows username &amp; password</text>

    <text x="664" y="416" class="t" font-size="13.5" font-weight="700">Friendly name (optional):</text>
    <rect x="664" y="426" width="446" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="678" y="449" class="t muted" font-size="13.5">Office Windows Workstation</text>

    <text x="664" y="482" class="t muted" font-size="12">Use Display tab for Retina scaling; Folders tab to share local Mac folders</text>

    <rect x="936" y="514" width="96" height="36" rx="8" fill="#2563eb"/>
    <text x="984" y="537" text-anchor="middle" class="t" font-size="14" font-weight="700" style="fill:#ffffff">Add</text>
    <rect x="1044" y="514" width="86" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="1087" y="537" text-anchor="middle" class="t muted" font-size="14" font-weight="600">Cancel</text>
  </g>

  <text x="600" y="610" text-anchor="middle" class="t muted" font-size="13.5">A certificate warning on first connection is expected for Windows self-signed RDP certs — verify the target IP and continue.</text>
</svg>
