<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" xml:lang="en-US" role="img" aria-labelledby="title desc">
  <title id="title">Larktun App Built-in RDP Form and Advanced Settings Guide</title>
  <desc id="desc">Annotated dark-mode RDP connection form showing Host, Port, Credentials, Advanced settings, H.264/AVC444, and Quality presets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="darkForm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .w { fill: #f8fafc; }
      .dm { fill: #94a3b8; }
      .muted { fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" class="t" font-size="27" font-weight="800">Larktun App Built-in RDP Form &amp; Advanced Settings</text>
  <text x="600" y="82" text-anchor="middle" class="t muted" font-size="15">For iPhone, iPad, Android phones &amp; tablets (layout illustration matching actual app fields)</text>

  <!-- Left: Dark App Form -->
  <g filter="url(#sh)">
    <rect x="48" y="106" width="520" height="618" rx="26" fill="url(#darkForm)" stroke="#1e293b" stroke-width="2"/>
    <circle cx="84" cy="144" r="16" fill="#ffffff" fill-opacity="0.1"/>
    <text x="84" y="149" text-anchor="middle" class="t w" font-size="15">‹</text>
    <circle cx="126" cy="144" r="16" fill="#ffffff" fill-opacity="0.1"/>
    <text x="126" y="149" text-anchor="middle" class="t" font-size="15" style="fill:#facc15">★</text>
    <text x="156" y="142" class="t w" font-size="17" font-weight="750">RDP client</text>
    <text x="156" y="159" class="m dm" font-size="11.5">100.64.0.10:3389</text>
    <rect x="444" y="130" width="100" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="494" y="147" text-anchor="middle" class="t dm" font-size="11.5" font-weight="600">Disconnected</text>

    <rect x="68" y="178" width="480" height="524" rx="20" fill="#161f2e" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="88" y="206" class="t w" font-size="15" font-weight="700">Connection</text>

    <rect x="88" y="220" width="320" height="48" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="102" y="236" class="t dm" font-size="11">Host</text>
    <text x="102" y="257" class="m w" font-size="15" font-weight="700">100.64.0.10</text>

    <rect x="420" y="220" width="108" height="48" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="434" y="236" class="t dm" font-size="11">Port</text>
    <text x="434" y="257" class="m w" font-size="15" font-weight="700">3389</text>

    <rect x="88" y="278" width="440" height="46" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="102" y="294" class="t dm" font-size="11">Username</text>
    <text x="102" y="314" class="m w" font-size="14">alex</text>

    <rect x="88" y="334" width="440" height="46" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="102" y="350" class="t dm" font-size="11">Password</text>
    <text x="102" y="370" class="m w" font-size="14">••••••••••••</text>
    <text x="484" y="362" class="t" font-size="12" style="fill:#60a5fa">Show</text>

    <rect x="88" y="390" width="440" height="42" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="102" y="405" class="t dm" font-size="11">Domain (optional)</text>
    <text x="102" y="423" class="t dm" font-size="12">Leave blank for workgroup / home PCs</text>

    <rect x="88" y="444" width="440" height="190" rx="14" fill="#0f172a" stroke="#334155"/>
    <text x="104" y="468" class="t w" font-size="13.5" font-weight="700">Advanced / Display settings</text>
    <text x="514" y="468" text-anchor="end" class="t dm" font-size="11.5">Auto-fit screen ▲</text>

    <rect x="102" y="480" width="132" height="34" rx="8" fill="#1e293b"/>
    <text x="114" y="502" class="t dm" font-size="12">Width: Auto</text>
    <rect x="242" y="480" width="132" height="34" rx="8" fill="#1e293b"/>
    <text x="254" y="502" class="t dm" font-size="12">Height: Auto</text>
    <rect x="382" y="480" width="132" height="34" rx="8" fill="#1e293b"/>
    <text x="394" y="502" class="t dm" font-size="12">Color: 32-bit</text>

    <text x="104" y="538" class="t w" font-size="12.5">NLA · Remote audio · H.264 (AVC444)</text>
    <rect x="466" y="524" width="44" height="20" rx="10" fill="#2563eb"/>
    <circle cx="499" cy="534" r="7.5" fill="#ffffff"/>

    <text x="104" y="566" class="t dm" font-size="11.5">Quality / bandwidth</text>
    <rect x="104" y="574" width="134" height="26" rx="8" fill="#2563eb"/>
    <text x="171" y="591" text-anchor="middle" class="t w" font-size="12" font-weight="700">Adaptive</text>
    <rect x="244" y="574" width="134" height="26" rx="8" fill="#1e293b"/>
    <text x="311" y="591" text-anchor="middle" class="t dm" font-size="12">Quality</text>
    <rect x="384" y="574" width="130" height="26" rx="8" fill="#1e293b"/>
    <text x="449" y="591" text-anchor="middle" class="t dm" font-size="12">Speed</text>

    <text x="104" y="622" class="t dm" font-size="11.5">Graphics:</text>
    <text x="166" y="622" class="t" font-size="12" font-weight="700" style="fill:#38bdf8">EGFX (recommended)</text>
    <text x="304" y="622" class="t dm" font-size="12">/ Legacy (RemoteFX)</text>

    <rect x="88" y="646" width="440" height="42" rx="14" fill="#2563eb"/>
    <text x="308" y="672" text-anchor="middle" class="t w" font-size="15.5" font-weight="750">Connect</text>
  </g>

  <g stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5 5">
    <path d="M528 244 H612"/>
    <path d="M528 358 H612"/>
    <path d="M528 504 H612"/>
    <path d="M528 604 H612"/>
  </g>

  <!-- Right: Callouts -->
  <g filter="url(#sh)">
    <rect x="612" y="138" width="540" height="128" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="644" cy="172" r="15" fill="#2563eb"/>
    <text x="644" y="177" text-anchor="middle" class="t w" font-size="14" font-weight="800">1</text>
    <text x="670" y="178" class="t" font-size="16.5" font-weight="750">Enter Host and Port Separately</text>
    <text x="636" y="206" class="t muted" font-size="13">• Direct mesh: enter Larktun IP (e.g. 100.64.0.10) or MagicDNS</text>
    <text x="636" y="229" class="t muted" font-size="13">• Subnet route: enter target LAN IP directly (e.g. 192.168.6.10)</text>
    <text x="636" y="252" class="t" font-size="12.5" font-weight="600" style="fill:#1d4ed8">Note: Keep port 3389 in the Port field, not inside Host</text>

    <rect x="612" y="286" width="540" height="126" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <circle cx="644" cy="320" r="15" fill="#0d9488"/>
    <text x="644" y="325" text-anchor="middle" class="t w" font-size="14" font-weight="800">2</text>
    <text x="670" y="326" class="t" font-size="16.5" font-weight="750">Windows Credentials &amp; Favorites</text>
    <text x="636" y="354" class="t muted" font-size="13">• Enter Windows username &amp; password (not Larktun password or PIN)</text>
    <text x="636" y="377" class="t muted" font-size="13">• Tap ★ to save to Favorites with a live desktop thumbnail</text>
    <text x="636" y="400" class="t muted" font-size="12.5">• Credentials stay encrypted in iOS Keychain / Android Keystore</text>

    <rect x="612" y="432" width="540" height="124" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="644" cy="466" r="15" fill="#4f46e5"/>
    <text x="644" y="471" text-anchor="middle" class="t w" font-size="14" font-weight="800">3</text>
    <text x="670" y="472" class="t" font-size="16.5" font-weight="750">Resolution, NLA &amp; Remote Audio</text>
    <text x="636" y="500" class="t muted" font-size="13">• Leave Width/Height empty for landscape auto-fit, or set custom px</text>
    <text x="636" y="523" class="t muted" font-size="13">• Keep NLA On and 32-bit color for Windows; use 16-bit if xrdp needs</text>
    <text x="636" y="546" class="t muted" font-size="13">• Remote audio is On by default and can be muted in-session</text>

    <rect x="612" y="576" width="540" height="148" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="644" cy="610" r="15" fill="#d97706"/>
    <text x="644" y="615" text-anchor="middle" class="t w" font-size="14" font-weight="800">4</text>
    <text x="670" y="616" class="t" font-size="16.5" font-weight="750">H.264 Hardware Decode &amp; Quality Presets</text>
    <text x="636" y="644" class="t muted" font-size="13">• EGFX + H.264 (AVC444) by default; auto-falls back if unsupported</text>
    <text x="636" y="667" class="t muted" font-size="13">• Adaptive: throttles fps under congestion, recovers automatically</text>
    <text x="636" y="690" class="t muted" font-size="13">• Speed: disables visual effects (~20 fps) for cellular / weak links</text>
    <text x="636" y="712" class="t" font-size="12.5" font-weight="600" style="fill:#b45309">• Quality: full wallpaper, themes &amp; font smoothing, uncapped fps</text>
  </g>
</svg>
