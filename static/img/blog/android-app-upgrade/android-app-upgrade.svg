<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">云雀通 Android App 全面升级</title>
  <desc id="desc">云雀通 Android App 集成智能发现、增强 WebView、SSH 与 RDP，并免费提供。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbf8"/>
      <stop offset="0.52" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#fff8e8"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="free" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .muted { fill: #475569; }
      .white { fill: #ffffff; }
      .title { font-size: 38px; font-weight: 800; }
      .subtitle { font-size: 20px; font-weight: 600; }
      .cardTitle { font-size: 23px; font-weight: 750; }
      .cardText { font-size: 16px; font-weight: 600; }
      .chip { font-size: 15px; font-weight: 700; }
      .card { fill: #ffffff; stroke: #dbe5ef; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="34" fill="url(#bg)"/>
  <circle cx="1070" cy="95" r="78" fill="#fde68a" opacity="0.4"/>
  <circle cx="110" cy="590" r="92" fill="#99f6e4" opacity="0.34"/>
  <text x="600" y="62" text-anchor="middle" class="text title">云雀通 Android App 全面升级</text>
  <text x="600" y="96" text-anchor="middle" class="text muted subtitle">发现网络里的服务，然后直接使用</text>

  <g filter="url(#shadow)">
    <rect x="82" y="152" width="282" height="410" rx="42" fill="#111827"/>
    <rect x="96" y="166" width="254" height="382" rx="31" fill="url(#phone)"/>
    <rect x="177" y="176" width="92" height="10" rx="5" fill="#0f172a" opacity="0.65"/>
    <circle cx="223" cy="268" r="48" fill="#ffffff" opacity="0.96"/>
    <path d="M197 268 C197 248 209 235 223 235 C237 235 249 248 249 268 L249 292 L197 292 Z" fill="#22c55e"/>
    <circle cx="211" cy="257" r="3" fill="#ffffff"/>
    <circle cx="235" cy="257" r="3" fill="#ffffff"/>
    <line x1="204" y1="236" x2="196" y2="224" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <line x1="242" y1="236" x2="250" y2="224" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <text x="223" y="350" text-anchor="middle" class="text white title">Android</text>
    <text x="223" y="386" text-anchor="middle" class="text white subtitle">一个 App</text>
    <text x="223" y="414" text-anchor="middle" class="text white subtitle">访问所有私有服务</text>
    <rect x="137" y="460" width="172" height="48" rx="24" fill="url(#free)"/>
    <text x="223" y="492" text-anchor="middle" class="text white cardTitle">免费使用</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="154" width="320" height="164" rx="24" class="card"/>
    <circle cx="468" cy="205" r="25" fill="#d1fae5"/>
    <path d="M457 205 A11 11 0 1 0 479 205 A11 11 0 1 0 457 205 M476 222 L488 234" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
    <text x="512" y="210" class="text cardTitle">智能发现</text>
    <text x="452" y="252" class="text muted cardText">Web · SSH · SFTP · RDP</text>
    <text x="452" y="280" class="text muted cardText">扫描、识别、点击即用</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="778" y="154" width="340" height="164" rx="24" class="card"/>
    <circle cx="826" cy="205" r="25" fill="#dbeafe"/>
    <circle cx="826" cy="205" r="14" fill="none" stroke="#2563eb" stroke-width="4"/>
    <path d="M812 201 H840 M826 191 V219" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <text x="870" y="210" class="text cardTitle">WebView 史诗级加强</text>
    <text x="810" y="252" class="text muted cardText">ComfyUI · 多标签 · 全屏</text>
    <text x="810" y="280" class="text muted cardText">上传下载 · 桌面模式</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="354" width="320" height="164" rx="24" class="card"/>
    <circle cx="468" cy="405" r="25" fill="#ede9fe"/>
    <path d="M455 398 L465 406 L455 414 M471 415 H483" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="512" y="410" class="text cardTitle">SSH 更顺手</text>
    <text x="452" y="452" class="text muted cardText">私钥导入 · 历史 · 快捷操作</text>
    <text x="452" y="480" class="text muted cardText">终端与 SFTP 同一工作台</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="778" y="354" width="340" height="164" rx="24" class="card"/>
    <circle cx="826" cy="405" r="25" fill="#ffedd5"/>
    <rect x="812" y="394" width="28" height="20" rx="3" fill="none" stroke="#ea580c" stroke-width="4"/>
    <path d="M821 419 H831 M826 414 V419" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
    <text x="870" y="410" class="text cardTitle">RDP 更清晰、更兼容</text>
    <text x="810" y="452" class="text muted cardText">H.264 / AVC444 · 自动回退</text>
    <text x="810" y="480" class="text muted cardText">音频 · 剪贴板 · 键鼠输入</text>
  </g>

  <rect x="420" y="562" width="698" height="58" rx="29" fill="url(#free)" filter="url(#shadow)"/>
  <text x="769" y="600" text-anchor="middle" class="text white cardTitle">最关键的是：免费</text>
</svg>

