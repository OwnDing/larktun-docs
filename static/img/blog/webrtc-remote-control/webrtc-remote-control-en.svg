  <text x="945" y="251" text-anchor="middle" font-size="17" class="muted">Same desktop. Pick up where you left off.</text>
  <g fill="#ffffff" fill-opacity=".055" stroke="#334155">
    <rect x="64" y="519" width="340" height="96" rx="18"/>
    <rect x="430" y="519" width="340" height="96" rx="18"/>
    <rect x="796" y="519" width="340" height="96" rx="18"/>
  </g>
  <text x="84" y="557" font-size="23" font-weight="700">Lightweight. Ad-free.</text>
  <text x="84" y="591" font-size="16" class="muted">A dedicated Host for your computer</text>
  <text x="450" y="557" font-size="23" font-weight="700">Multiple devices</text>
  <text x="450" y="591" font-size="16" class="muted">Shared view · One controller · Take over</text>
  <text x="816" y="557" font-size="23" font-weight="700">Your private network</text>
  <text x="816" y="591" font-size="16" class="muted">No public remote-control port forwarding</text>
  <text x="64" y="651" font-size="16" class="muted">Feature illustration, not a product screenshot. WebRTC support for more platforms is planned.</text>
