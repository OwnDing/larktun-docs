<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" xml:lang="en-US" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft RDP Remote Desktop Architecture over Larktun</title>
  <desc id="desc">Shows how Windows mstsc, macOS Windows App, and Larktun mobile apps connect to Windows RDP (TCP 3389) over Larktun direct mesh or subnet routing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="0.55" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #475569; }
      .white { fill: #ffffff; }
      .sky { fill: #7dd3fc; }
      .card { fill: #ffffff; stroke: #dbe5f1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="86" r="110" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="96" cy="610" r="100" fill="#a7f3d0" opacity="0.28"/>

  <!-- Header -->
  <text x="600" y="56" text-anchor="middle" class="t" font-size="30" font-weight="800">Microsoft RDP over Larktun Architecture</text>
  <text x="600" y="88" text-anchor="middle" class="t muted" font-size="16" font-weight="500">No public IP or port 3389 forwarding · Desktop uses mstsc / Windows App · Mobile uses built-in Larktun RDP</text>

  <!-- Connectors -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M366 206 H452" stroke="#2563eb" stroke-dasharray="7 6"/>
    <path d="M366 346 H452" stroke="#2563eb" stroke-dasharray="7 6"/>
    <path d="M366 492 H452" stroke="#0d9488" stroke-dasharray="7 6"/>
    <path d="M748 258 H834" stroke="#2563eb"/>
    <path d="M748 456 H834" stroke="#d97706"/>
  </g>
  <polygon points="452,206 441,200 441,212" fill="#2563eb"/>
  <polygon points="452,346 441,340 441,352" fill="#2563eb"/>
  <polygon points="452,492 441,486 441,498" fill="#0d9488"/>
  <polygon points="834,258 823,252 823,264" fill="#2563eb"/>
  <polygon points="834,456 823,450 823,462" fill="#d97706"/>

  <!-- Left Column -->
  <text x="206" y="130" text-anchor="middle" class="t" font-size="17" font-weight="750">1. Client Device (Controller)</text>

  <g filter="url(#shadow)">
    <rect x="46" y="148" width="320" height="116" rx="18" class="card"/>
    <rect x="64" y="164" width="96" height="24" rx="12" fill="#dbeafe"/>
    <text x="112" y="180" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#1d4ed8">Windows PC</text>
    <text x="64" y="212" class="t" font-size="16.5" font-weight="750">Built-in Remote Desktop (mstsc)</text>
    <text x="64" y="235" class="t muted" font-size="13">Sign in with Larktun Desktop Client</text>
    <text x="64" y="253" class="t muted" font-size="12.5">System TUN routes private IP directly</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="46" y="286" width="320" height="116" rx="18" class="card"/>
    <rect x="64" y="302" width="76" height="24" rx="12" fill="#e0e7ff"/>
    <text x="102" y="318" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#4338ca">macOS</text>
    <text x="64" y="350" class="t" font-size="16.5" font-weight="750">Microsoft Windows App</text>
    <text x="64" y="373" class="t muted" font-size="13">Formerly Microsoft Remote Desktop</text>
    <text x="64" y="391" class="t muted" font-size="12.5">Works with Larktun Desktop Client</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="46" y="424" width="320" height="136" rx="18" fill="#ffffff" stroke="#5eead4" stroke-width="2"/>
    <rect x="64" y="440" width="184" height="24" rx="12" fill="#ccfbf1"/>
    <text x="156" y="456" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#0f766e">iPhone / iPad / Android / TV</text>
    <text x="64" y="488" class="t" font-size="16.5" font-weight="750">Larktun App Built-in RDP</text>
    <text x="64" y="511" class="t muted" font-size="13">No system VPN needed · H.264 decode</text>
    <text x="64" y="530" class="t muted" font-size="12.5">Audio, clipboard, favorites, external display</text>
    <text x="64" y="549" class="t" font-size="12" font-weight="600" style="fill:#0f766e">No separate RDP app required</text>
  </g>

  <!-- Center Pillar -->
  <g filter="url(#shadow)">
    <rect x="452" y="148" width="296" height="412" rx="24" fill="url(#tunnel)"/>
    <rect x="518" y="172" width="164" height="28" rx="14" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="600" y="191" text-anchor="middle" class="t sky" font-size="12.5" font-weight="700">LARKTUN PRIVATE MESH</text>

    <path d="M582 238 V226 A18 18 0 0 1 618 226 V238" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="574" y="236" width="52" height="40" rx="10" fill="url(#blueGrad)"/>
    <circle cx="600" cy="256" r="4.5" fill="#0f172a"/>

    <text x="600" y="308" text-anchor="middle" class="t white" font-size="21" font-weight="750">Encrypted Tunnel</text>
    <text x="600" y="334" text-anchor="middle" class="t" font-size="13.5" style="fill:#cbd5e1">WireGuard P2P · DERP relay fallback</text>

    <rect x="478" y="360" width="244" height="48" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#334155"/>
    <text x="600" y="381" text-anchor="middle" class="t white" font-size="13.5" font-weight="700">Private Tunnel Port</text>
    <text x="600" y="400" text-anchor="middle" class="m sky" font-size="13">TCP 3389 (Default RDP)</text>

    <rect x="478" y="422" width="244" height="48" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#334155"/>
    <text x="600" y="443" text-anchor="middle" class="t white" font-size="13.5" font-weight="700">Zero Public Exposure</text>
    <text x="600" y="462" text-anchor="middle" class="t" font-size="12" style="fill:#cbd5e1">No router port forwarding on 3389</text>

    <rect x="478" y="484" width="244" height="52" rx="12" fill="#10b981" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="600" y="506" text-anchor="middle" class="t" font-size="13.5" font-weight="700" style="fill:#6ee7b7">Identity &amp; ACL Guarded</text>
    <text x="600" y="525" text-anchor="middle" class="t" font-size="12" style="fill:#d1fae5">Only authorized users &amp; devices connect</text>
  </g>

  <!-- Right Column -->
  <text x="994" y="130" text-anchor="middle" class="t" font-size="17" font-weight="750">2. Target Host (Microsoft RDP)</text>

  <g filter="url(#shadow)">
    <rect x="834" y="148" width="320" height="196" rx="18" class="card"/>
    <rect x="852" y="166" width="136" height="24" rx="12" fill="#dbeafe"/>
    <text x="920" y="182" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#1d4ed8">Mode A · Direct Mesh</text>
    <text x="852" y="216" class="t" font-size="17" font-weight="750">Target Windows Host</text>
    <text x="852" y="242" class="t muted" font-size="13">1. Enable Remote Desktop (Pro / Ent)</text>
    <text x="852" y="264" class="t muted" font-size="13">2. Run Larktun Desktop Client</text>
    <rect x="852" y="282" width="284" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="866" y="301" class="t muted" font-size="12">Connect using Larktun Private IP:</text>
    <text x="866" y="319" class="m" font-size="14" font-weight="700" style="fill:#1d4ed8">100.64.0.10 : 3389</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="834" y="366" width="320" height="194" rx="18" fill="#ffffff" stroke="#fcd34d" stroke-width="1.8"/>
    <rect x="852" y="384" width="144" height="24" rx="12" fill="#fef3c7"/>
    <text x="924" y="400" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#b45309">Mode B · Subnet Route</text>
    <text x="852" y="432" class="t" font-size="17" font-weight="750">Office LAN Windows Host</text>
    <text x="852" y="458" class="t muted" font-size="13">Router advertises 192.168.6.0/24</text>
    <text x="852" y="480" class="t muted" font-size="13">Target enables RDP; client optional</text>
    <rect x="852" y="498" width="284" height="44" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text x="866" y="517" class="t muted" font-size="12">Connect using LAN IP:</text>
    <text x="866" y="535" class="m" font-size="14" font-weight="700" style="fill:#b45309">192.168.6.10 : 3389</text>
  </g>

  <!-- Footer -->
  <rect x="46" y="592" width="1108" height="54" rx="16" fill="#ffffff" stroke="#dbe5f1" stroke-width="1.5"/>
  <text x="600" y="624" text-anchor="middle" class="t" font-size="13.5" font-weight="600">Note: Windows Home editions do not include the Microsoft RDP server. Use Larktun WebRTC or RustDesk Direct IP for Windows Home. Conceptual diagram.</text>
</svg>
