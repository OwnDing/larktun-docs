    <path d="M190 354 H480"/>
    <path d="M440 413 H480"/>
    <path d="M720 375 H770"/>
  </g>
  <rect x="80" y="267" width="110" height="207" rx="21" fill="#0f172a" stroke="#7dd3fc" stroke-width="2"/>
