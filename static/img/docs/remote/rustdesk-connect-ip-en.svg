<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" xml:lang="en-US" role="img" aria-labelledby="title desc">
  <title id="title">Connecting from RustDesk Client Using a Larktun IP</title>
  <desc id="desc">UI illustration showing how to enter a Larktun IP or subnet IP in RustDesk and authenticate with the permanent password.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #475569; }
      .w { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" class="t" font-size="27" font-weight="800">Connect from RustDesk Client Using a Private IP</text>
  <text x="600" y="82" text-anchor="middle" class="t muted" font-size="14.5">Confirm Larktun is connected and the target is Online, then enter its IP in RustDesk (UI illustration)</text>

  <!-- Left -->
  <g filter="url(#sh)">
    <rect x="46" y="112" width="560" height="422" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="46" y="112" width="560" height="44" rx="18" fill="#f8fafc"/>
    <rect x="46" y="140" width="560" height="16" fill="#f8fafc"/>
    <line x1="46" y1="156" x2="606" y2="156" stroke="#e2e8f0"/>
    <circle cx="72" cy="134" r="7" fill="#0284c7"/>
    <text x="90" y="139" class="t" font-size="14" font-weight="750">RustDesk Home (Controller)</text>

    <text x="72" y="192" class="t" font-size="16" font-weight="750">Control Remote Desktop</text>
    <rect x="72" y="206" width="508" height="52" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.2"/>
    <text x="90" y="238" class="m" font-size="19" font-weight="750" style="fill:#0369a1">100.64.0.10</text>
    <rect x="518" y="214" width="52" height="36" rx="8" fill="#0284c7"/>
    <text x="544" y="238" text-anchor="middle" class="t w" font-size="18" font-weight="800">→</text>

    <rect x="72" y="276" width="508" height="122" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="90" y="302" class="t" font-size="13.5" font-weight="750">Three supported target formats:</text>
    <text x="90" y="328" class="m" font-size="13" font-weight="700" style="fill:#0369a1">100.64.0.10</text>
    <text x="268" y="328" class="t muted" font-size="12.5">Direct mesh (default port 21118)</text>
    <text x="90" y="354" class="m" font-size="13" font-weight="700" style="fill:#4f46e5">100.64.0.10:21118</text>
    <text x="268" y="354" class="t muted" font-size="12.5">Explicit or custom Direct IP port</text>
    <text x="90" y="380" class="m" font-size="13" font-weight="700" style="fill:#b45309">192.168.6.10</text>
    <text x="268" y="380" class="t muted" font-size="12.5">LAN IP via approved subnet route</text>

    <text x="72" y="428" class="t muted" font-size="12.5" font-weight="700">Recent Sessions / Favorites (double-click to reconnect)</text>
    <rect x="72" y="442" width="244" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="86" y="456" width="38" height="28" rx="6" fill="#0f172a"/>
    <text x="136" y="472" class="t" font-size="13" font-weight="700">Home PC (Win Home)</text>
    <text x="136" y="492" class="m muted" font-size="12">100.64.0.10</text>

    <rect x="336" y="442" width="244" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="350" y="456" width="38" height="28" rx="6" fill="#1e3a8a"/>
    <text x="400" y="472" class="t" font-size="13" font-weight="700">Office PC (Subnet)</text>
    <text x="400" y="492" class="m muted" font-size="12">192.168.6.10</text>
  </g>

  <path d="M622 323 H674" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="682,323 668,315 668,331" fill="#0284c7"/>

  <!-- Right Top -->
  <g filter="url(#sh)">
    <rect x="692" y="112" width="462" height="252" rx="18" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/>
    <rect x="692" y="112" width="462" height="44" rx="18" fill="#f0fdfa"/>
    <rect x="692" y="140" width="462" height="16" fill="#f0fdfa"/>
    <line x1="692" y1="156" x2="1154" y2="156" stroke="#ccfbf1"/>
    <text x="718" y="139" class="t" font-size="14" font-weight="750" style="fill:#0f766e">Password Required — Connecting to 100.64.0.10</text>

    <text x="718" y="190" class="t" font-size="13" font-weight="700">Enter the target PC's permanent RustDesk password:</text>
    <rect x="718" y="204" width="410" height="40" rx="8" fill="#f8fafc" stroke="#0d9488" stroke-width="1.8"/>
    <text x="734" y="230" class="m" font-size="16" font-weight="700">••••••••••••••</text>

    <rect x="718" y="260" width="18" height="18" rx="4" fill="#0d9488"/>
    <path d="M722 269 L725 272 L732 265" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="744" y="274" class="t" font-size="13">Remember password (trusted personal devices)</text>

    <rect x="942" y="306" width="94" height="36" rx="8" fill="#0d9488"/>
    <text x="989" y="329" text-anchor="middle" class="t w" font-size="14" font-weight="700">OK</text>
    <rect x="1046" y="306" width="82" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="1087" y="329" text-anchor="middle" class="t muted" font-size="14">Cancel</text>
  </g>

  <!-- Right Bottom -->
  <g filter="url(#sh)">
    <rect x="692" y="384" width="462" height="150" rx="18" fill="#ffffff" stroke="#dbe5f1" stroke-width="1.5"/>
    <text x="716" y="416" class="t" font-size="15.5" font-weight="750">Helpful In-Session Features</text>
    <text x="716" y="444" class="t muted" font-size="13">• Quality: switch Good Quality / Balanced / Optimize Reaction</text>
    <text x="716" y="468" class="t muted" font-size="13">• File Transfer: launch Transfer File mode from the tile menu</text>
    <text x="716" y="492" class="t muted" font-size="13">• Multi-monitor switching, audio forwarding &amp; clipboard sync</text>
    <text x="716" y="516" class="t" font-size="12.5" font-weight="600" style="fill:#0369a1">• Traffic flows privately end-to-end inside your Larktun mesh</text>
  </g>

  <text x="600" y="584" text-anchor="middle" class="t muted" font-size="13.5">Tip: Even if RustDesk shows "Not ready" for public ID servers at the bottom, Direct IP access over Larktun still works normally.</text>
</svg>
