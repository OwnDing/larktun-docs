  <rect x="244" y="397" width="124" height="7" rx="3" fill="#94a3b8" opacity=".5"/>
  <text x="327" y="310" text-anchor="middle" font-size="17" class="muted">iPad · Viewer</text>
  <rect x="480" y="293" width="240" height="164" rx="24" fill="#ffffff" fill-opacity=".055" stroke="#475569"/>
  <path d="M586 328 V320 A14 14 0 0 1 614 320 V328" fill="none" stroke="#7dd3fc" stroke-width="3"/>
