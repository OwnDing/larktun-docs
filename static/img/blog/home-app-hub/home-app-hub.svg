<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">云雀通把组网变成一个家庭应用中心</title>
  <desc id="desc">iPhone 和 iPad 通过云雀通安全网络，自动发现组网设备里的 SSH、RDP、Web、WebRTC 服务，并在一个 App 内完成访问与控制。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/>
      <stop offset="0.48" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#fff8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3b82f6"/>
    </marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .muted { fill: #475569; }
      .inverse { fill: #ffffff; }
      .inverseMuted { fill: #e0f2fe; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 20px; font-weight: 600; }
      .cardTitle { font-size: 21px; font-weight: 700; }
      .cardText { font-size: 16px; font-weight: 600; }
      .chip { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .line { fill: none; stroke: #3b82f6; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
      .card { fill: #ffffff; stroke: rgba(15, 23, 42, 0.12); stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="72" fill="#fde68a" opacity="0.35"/>
  <circle cx="150" cy="580" r="88" fill="#99f6e4" opacity="0.32"/>

  <text x="600" y="64" text-anchor="middle" class="label title">一个 App，访问整张家庭网络</text>

  <!-- Left: mobile devices -->
  <g filter="url(#softShadow)">
    <rect x="70" y="250" width="220" height="180" rx="24" class="card"/>
    <text x="180" y="300" text-anchor="middle" class="label cardTitle">iPhone / iPad</text>
    <text x="180" y="334" text-anchor="middle" class="label muted cardText">随身的客户端</text>
    <rect x="100" y="356" width="74" height="34" rx="17" fill="#ecfdf5"/>
    <text x="137" y="379" text-anchor="middle" class="label chip">轻办公</text>
    <rect x="186" y="356" width="74" height="34" rx="17" fill="#eff6ff"/>
    <text x="223" y="379" text-anchor="middle" class="label chip">远程</text>
  </g>

  <!-- Center: Larktun secure network + discovery -->
  <path class="line" d="M290 340 C350 340 360 340 408 340"/>
  <g filter="url(#softShadow)">
    <rect x="408" y="232" width="290" height="216" rx="24" fill="url(#core)"/>
    <text x="553" y="296" text-anchor="middle" class="label title inverse">云雀通</text>
    <text x="553" y="328" text-anchor="middle" class="label subtitle inverseMuted">安全组网 + 智能发现</text>
    <rect x="438" y="356" width="100" height="34" rx="17" fill="#ffffff" opacity="0.94"/>
    <text x="488" y="379" text-anchor="middle" class="label chip">端到端加密</text>
    <rect x="548" y="356" width="120" height="34" rx="17" fill="#ffffff" opacity="0.94"/>
    <text x="608" y="379" text-anchor="middle" class="label chip">服务自动发现</text>
    <rect x="468" y="398" width="170" height="34" rx="17" fill="#ffffff" opacity="0.94"/>
    <text x="553" y="421" text-anchor="middle" class="label chip">SSH · RDP · Web · WebRTC</text>
  </g>

  <!-- Right: discovered services / home devices -->
  <path class="line" d="M698 300 C760 280 800 250 858 232"/>
  <path class="line" d="M698 340 C770 340 800 340 858 340"/>
  <path class="line" d="M698 380 C760 400 800 430 858 448"/>

  <g filter="url(#softShadow)">
    <rect x="858" y="170" width="272" height="92" rx="20" class="card"/>
    <text x="994" y="208" text-anchor="middle" class="label cardTitle">电脑 / 服务器</text>
    <text x="994" y="236" text-anchor="middle" class="label muted cardText">SSH 终端 · RDP 远程桌面</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="858" y="294" width="272" height="92" rx="20" class="card"/>
    <text x="994" y="332" text-anchor="middle" class="label cardTitle">NAS / 内网 Web</text>
    <text x="994" y="360" text-anchor="middle" class="label muted cardText">后台面板 · 仪表盘 · 控制台</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="858" y="418" width="272" height="92" rx="20" class="card"/>
    <text x="994" y="456" text-anchor="middle" class="label cardTitle">智能家居 / 摄像头</text>
    <text x="994" y="484" text-anchor="middle" class="label muted cardText">安全下达指令 · 自主可控</text>
  </g>

  <text x="600" y="600" text-anchor="middle" class="label muted cardText">无需记忆 IP 与端口 · 组网即发现 · 不依赖第三方云中转</text>
</svg>
