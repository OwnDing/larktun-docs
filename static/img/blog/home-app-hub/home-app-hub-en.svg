<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Larktun turns networking into a home application hub</title>
  <desc id="desc">iPhone and iPad join the secure Larktun network, automatically discover SSH, RDP, Web, and WebRTC services on home devices, and access and control them from one app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/>
      <stop offset="0.48" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#fff8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3b82f6"/>
    </marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .muted { fill: #475569; }
      .inverse { fill: #ffffff; }
      .inverseMuted { fill: #e0f2fe; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 19px; font-weight: 600; }
      .cardTitle { font-size: 20px; font-weight: 700; }
      .cardText { font-size: 15px; font-weight: 600; }
      .chip { font-size: 14.5px; font-weight: 700; fill: #0f172a; }
      .line { fill: none; stroke: #3b82f6; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
      .card { fill: #ffffff; stroke: rgba(15, 23, 42, 0.12); stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="72" fill="#fde68a" opacity="0.35"/>
  <circle cx="150" cy="580" r="88" fill="#99f6e4" opacity="0.32"/>

  <text x="600" y="64" text-anchor="middle" class="label title">One app for your whole home network</text>

  <!-- Left: mobile devices -->
  <g filter="url(#softShadow)">
    <rect x="70" y="250" width="220" height="180" rx="24" class="card"/>
    <text x="180" y="300" text-anchor="middle" class="label cardTitle">iPhone / iPad</text>
    <text x="180" y="334" text-anchor="middle" class="label muted cardText">Your everyday client</text>
    <rect x="100" y="356" width="78" height="34" rx="17" fill="#ecfdf5"/>
    <text x="139" y="379" text-anchor="middle" class="label chip">Work</text>
    <rect x="190" y="356" width="78" height="34" rx="17" fill="#eff6ff"/>
    <text x="229" y="379" text-anchor="middle" class="label chip">Remote</text>
  </g>

  <!-- Center: Larktun secure network + discovery -->
  <path class="line" d="M290 340 C350 340 360 340 408 340"/>
  <g filter="url(#softShadow)">
    <rect x="408" y="232" width="290" height="216" rx="24" fill="url(#core)"/>
    <text x="553" y="296" text-anchor="middle" class="label title inverse">Larktun</text>
    <text x="553" y="328" text-anchor="middle" class="label subtitle inverseMuted">Secure mesh + discovery</text>
    <rect x="436" y="356" width="120" height="34" rx="17" fill="#ffffff" opacity="0.94"/>
    <text x="496" y="379" text-anchor="middle" class="label chip">End-to-end</text>
    <rect x="566" y="356" width="104" height="34" rx="17" fill="#ffffff" opacity="0.94"/>
    <text x="618" y="379" text-anchor="middle" class="label chip">Auto-discover</text>
    <rect x="468" y="398" width="170" height="34" rx="17" fill="#ffffff" opacity="0.94"/>
    <text x="553" y="421" text-anchor="middle" class="label chip">SSH · RDP · Web · WebRTC</text>
  </g>

  <!-- Right: discovered services / home devices -->
  <path class="line" d="M698 300 C760 280 800 250 858 232"/>
  <path class="line" d="M698 340 C770 340 800 340 858 340"/>
  <path class="line" d="M698 380 C760 400 800 430 858 448"/>

  <g filter="url(#softShadow)">
    <rect x="858" y="170" width="272" height="92" rx="20" class="card"/>
    <text x="994" y="208" text-anchor="middle" class="label cardTitle">PC / Server</text>
    <text x="994" y="236" text-anchor="middle" class="label muted cardText">SSH terminal · RDP desktop</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="858" y="294" width="272" height="92" rx="20" class="card"/>
    <text x="994" y="332" text-anchor="middle" class="label cardTitle">NAS / Internal Web</text>
    <text x="994" y="360" text-anchor="middle" class="label muted cardText">Admin panels · dashboards</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="858" y="418" width="272" height="92" rx="20" class="card"/>
    <text x="994" y="456" text-anchor="middle" class="label cardTitle">Smart home / Camera</text>
    <text x="994" y="484" text-anchor="middle" class="label muted cardText">Secure commands · self-hosted</text>
  </g>

  <text x="600" y="600" text-anchor="middle" class="label muted cardText">No IPs or ports to memorize · discover on connect · no third-party cloud relay</text>
</svg>
