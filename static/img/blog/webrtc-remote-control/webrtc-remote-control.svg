  <text x="1045" y="69" text-anchor="middle" font-size="17" font-weight="700" style="fill:#6ee7b7">正式上线</text>
  <text x="64" y="150" font-size="48" font-weight="750">电脑留在原地，随时回到现场。</text>
  <text x="64" y="196" font-size="23" class="muted">轻量无广告 · Windows / macOS 被控端 · iPhone / iPad 客户端</text>
