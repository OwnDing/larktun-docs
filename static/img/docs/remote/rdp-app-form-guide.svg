<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">云雀通 App 内置 RDP 连接配置与高级设置详解</title>
  <desc id="desc">展示云雀通 iOS 和 Android App 内置 RDP 连接表单的各个字段、默认值以及高级画质和编解码参数说明。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="darkForm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #0f172a; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .w { fill: #f8fafc; }
      .dm { fill: #94a3b8; }
      .muted { fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" class="t" font-size="28" font-weight="800">云雀通 App 内置 RDP 连接表单与高级设置说明</text>
  <text x="600" y="82" text-anchor="middle" class="t muted" font-size="15">适用于 iPhone / iPad / Android 手机和平板（界面布局示意，对照 App 实际字段）</text>

  <!-- Left: Dark App Form -->
  <g filter="url(#sh)">
    <rect x="48" y="106" width="520" height="618" rx="26" fill="url(#darkForm)" stroke="#1e293b" stroke-width="2"/>
    <!-- Header -->
    <circle cx="84" cy="144" r="16" fill="#ffffff" fill-opacity="0.1"/>
    <text x="84" y="149" text-anchor="middle" class="t w" font-size="15">‹</text>
    <circle cx="126" cy="144" r="16" fill="#ffffff" fill-opacity="0.1"/>
    <text x="126" y="149" text-anchor="middle" class="t" font-size="15" style="fill:#facc15">★</text>
    <text x="156" y="142" class="t w" font-size="17" font-weight="750">RDP 客户端</text>
    <text x="156" y="159" class="m dm" font-size="11.5">100.64.0.10:3389</text>
    <rect x="466" y="130" width="78" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="505" y="147" text-anchor="middle" class="t dm" font-size="12" font-weight="600">未连接</text>

    <!-- Main Form Panel -->
    <rect x="68" y="178" width="480" height="524" rx="20" fill="#161f2e" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="88" y="206" class="t w" font-size="15" font-weight="700">连接配置</text>

    <!-- Host + Port -->
    <rect x="88" y="220" width="320" height="48" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="102" y="236" class="t dm" font-size="11">主机</text>
    <text x="102" y="257" class="m w" font-size="15" font-weight="700">100.64.0.10</text>

    <rect x="420" y="220" width="108" height="48" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="434" y="236" class="t dm" font-size="11">端口</text>
    <text x="434" y="257" class="m w" font-size="15" font-weight="700">3389</text>

    <!-- Username & Password & Domain -->
    <rect x="88" y="278" width="440" height="46" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="102" y="294" class="t dm" font-size="11">用户名</text>
    <text x="102" y="314" class="m w" font-size="14">alex</text>

    <rect x="88" y="334" width="440" height="46" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="102" y="350" class="t dm" font-size="11">密码</text>
    <text x="102" y="370" class="m w" font-size="14">••••••••••••</text>
    <text x="488" y="362" class="t" font-size="12" style="fill:#60a5fa">显示</text>

    <rect x="88" y="390" width="440" height="42" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="102" y="405" class="t dm" font-size="11">域（可选）</text>
    <text x="102" y="423" class="t dm" font-size="12.5">家用/工作组留空，企业 AD 域按需填写</text>

    <!-- Advanced Settings Expanded -->
    <rect x="88" y="444" width="440" height="190" rx="14" fill="#0f172a" stroke="#334155"/>
    <text x="104" y="468" class="t w" font-size="13.5" font-weight="700">高级设置 / 显示设置</text>
    <text x="514" y="468" text-anchor="end" class="t dm" font-size="11.5">自动适配屏幕 ▲</text>

    <!-- Resolution + Color depth -->
    <rect x="102" y="480" width="132" height="34" rx="8" fill="#1e293b"/>
    <text x="114" y="502" class="t dm" font-size="12">宽度: 自动</text>
    <rect x="242" y="480" width="132" height="34" rx="8" fill="#1e293b"/>
    <text x="254" y="502" class="t dm" font-size="12">高度: 自动</text>
    <rect x="382" y="480" width="132" height="34" rx="8" fill="#1e293b"/>
    <text x="394" y="502" class="t dm" font-size="12">色深: 32</text>

    <!-- Toggles -->
    <text x="104" y="538" class="t w" font-size="12.5">网络级别认证 NLA · 远端声音 · H.264 (AVC444)</text>
    <rect x="466" y="524" width="44" height="20" rx="10" fill="#2563eb"/>
    <circle cx="499" cy="534" r="7.5" fill="#ffffff"/>

    <!-- Quality Preset Segmented -->
    <text x="104" y="566" class="t dm" font-size="11.5">画质 / 带宽</text>
    <rect x="104" y="574" width="134" height="26" rx="8" fill="#2563eb"/>
    <text x="171" y="591" text-anchor="middle" class="t w" font-size="12" font-weight="700">自适应</text>
    <rect x="244" y="574" width="134" height="26" rx="8" fill="#1e293b"/>
    <text x="311" y="591" text-anchor="middle" class="t dm" font-size="12">画质优先</text>
    <rect x="384" y="574" width="130" height="26" rx="8" fill="#1e293b"/>
    <text x="449" y="591" text-anchor="middle" class="t dm" font-size="12">速度优先</text>

    <!-- Graphics mode -->
    <text x="104" y="622" class="t dm" font-size="11.5">图形模式：</text>
    <text x="172" y="622" class="t" font-size="12" font-weight="700" style="fill:#38bdf8">EGFX（推荐）</text>
    <text x="272" y="622" class="t dm" font-size="12">/ 传统模式（RemoteFX）</text>

    <!-- Connect Button -->
    <rect x="88" y="646" width="440" height="42" rx="14" fill="#2563eb"/>
    <text x="308" y="672" text-anchor="middle" class="t w" font-size="15.5" font-weight="750">连接</text>
  </g>

  <!-- Connecting Callout Lines -->
  <g stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5 5">
    <path d="M528 244 H612"/>
    <path d="M528 358 H612"/>
    <path d="M528 504 H612"/>
    <path d="M528 604 H612"/>
  </g>

  <!-- Right: Callout Cards -->
  <g filter="url(#sh)">
    <!-- Callout 1 -->
    <rect x="612" y="138" width="540" height="128" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="644" cy="172" r="15" fill="#2563eb"/>
    <text x="644" y="177" text-anchor="middle" class="t w" font-size="14" font-weight="800">1</text>
    <text x="670" y="178" class="t" font-size="17" font-weight="750">主机与端口分开填写</text>
    <text x="636" y="206" class="t muted" font-size="13.5">• 直接组网填云雀通 IP（如 100.64.0.10）或 MagicDNS 名称</text>
    <text x="636" y="229" class="t muted" font-size="13.5">• 子网路由模式直接填目标电脑局域网 IP（如 192.168.6.10）</text>
    <text x="636" y="252" class="t" font-size="13" font-weight="600" style="fill:#1d4ed8">注意：不要把 100.64.0.10:3389 整段写进主机栏</text>

    <!-- Callout 2 -->
    <rect x="612" y="286" width="540" height="126" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <circle cx="644" cy="320" r="15" fill="#0d9488"/>
    <text x="644" y="325" text-anchor="middle" class="t w" font-size="14" font-weight="800">2</text>
    <text x="670" y="326" class="t" font-size="17" font-weight="750">账户凭据与收藏保存</text>
    <text x="636" y="354" class="t muted" font-size="13.5">• 填目标 Windows 登录用户名和密码（非云雀通密码、非开机 PIN）</text>
    <text x="636" y="377" class="t muted" font-size="13.5">• 点击左上角星标 ★ 可加入「收藏」，下次带桌面缩略图一键进入</text>
    <text x="636" y="400" class="t muted" font-size="13">• 凭据在 iOS 存系统 Keychain，在 Android 使用 Keystore 加密存储</text>

    <!-- Callout 3 -->
    <rect x="612" y="432" width="540" height="124" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="644" cy="466" r="15" fill="#4f46e5"/>
    <text x="644" y="471" text-anchor="middle" class="t w" font-size="14" font-weight="800">3</text>
    <text x="670" y="472" class="t" font-size="17" font-weight="750">分辨率、NLA 与远端声音</text>
    <text x="636" y="500" class="t muted" font-size="13.5">• 宽高留空则自动按横屏比例适配，也可手填如 1920 × 1080</text>
    <text x="636" y="523" class="t muted" font-size="13.5">• Windows 保持 NLA 开启、色深 32；xrdp 如遇兼容问题可降到 16</text>
    <text x="636" y="546" class="t muted" font-size="13.5">• 「远端声音」默认开启，连接后可在悬浮球中随时一键静音</text>

    <!-- Callout 4 -->
    <rect x="612" y="576" width="540" height="148" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="644" cy="610" r="15" fill="#d97706"/>
    <text x="644" y="615" text-anchor="middle" class="t w" font-size="14" font-weight="800">4</text>
    <text x="670" y="616" class="t" font-size="17" font-weight="750">H.264 硬解与画质 / 带宽预设</text>
    <text x="636" y="644" class="t muted" font-size="13.5">• 默认 EGFX + H.264（AVC444）硬解；服务端不支持时自动回落</text>
    <text x="636" y="667" class="t muted" font-size="13.5">• 自适应：拥塞自动降帧，网络恢复后提帧（推荐日常使用）</text>
    <text x="636" y="690" class="t muted" font-size="13.5">• 速度优先：关闭壁纸动画并限制约 20 fps，4G/5G 弱网更跟手</text>
    <text x="636" y="712" class="t" font-size="12.5" font-weight="600" style="fill:#b45309">• 画质优先：完整保留壁纸与平滑字体，不限帧率</text>
  </g>
</svg>
