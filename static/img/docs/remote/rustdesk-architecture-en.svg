<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" xml:lang="en-US" role="img" aria-labelledby="title desc">
  <title id="title">RustDesk Direct IP Remote Architecture over Larktun</title>
  <desc id="desc">Shows how desktop and VPN-mode mobile RustDesk clients reach target computers via TCP 21118 over Larktun without public relays or self-hosting hbbs/hbbr.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="0.55" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #475569; }
      .white { fill: #ffffff; }
      .card { fill: #ffffff; stroke: #dbe5f1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1115" cy="90" r="105" fill="#99f6e4" opacity="0.3"/>
  <circle cx="88" cy="600" r="95" fill="#bfdbfe" opacity="0.32"/>

  <text x="600" y="54" text-anchor="middle" class="t" font-size="30" font-weight="800">RustDesk Direct IP Remote over Larktun</text>
  <text x="600" y="86" text-anchor="middle" class="t muted" font-size="15.5">No self-hosted hbbs/hbbr · Bypass public relays · Works on Windows Home/Pro, macOS &amp; Linux</text>

  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M366 246 H452" stroke="#0284c7" stroke-dasharray="7 6"/>
    <path d="M366 446 H452" stroke="#0d9488" stroke-dasharray="7 6"/>
    <path d="M748 258 H834" stroke="#0284c7"/>
    <path d="M748 456 H834" stroke="#d97706"/>
  </g>
  <polygon points="452,246 441,240 441,252" fill="#0284c7"/>
  <polygon points="452,446 441,440 441,452" fill="#0d9488"/>
  <polygon points="834,258 823,252 823,264" fill="#0284c7"/>
  <polygon points="834,456 823,450 823,462" fill="#d97706"/>

  <!-- Left -->
  <text x="206" y="130" text-anchor="middle" class="t" font-size="17" font-weight="750">1. Controller (RustDesk Client)</text>

  <g filter="url(#sh)">
    <rect x="46" y="148" width="320" height="196" rx="18" class="card"/>
    <rect x="64" y="166" width="160" height="24" rx="12" fill="#e0f2fe"/>
    <text x="144" y="182" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#0369a1">Windows / macOS / Linux</text>
    <text x="64" y="216" class="t" font-size="17" font-weight="750">Connect Directly by IP</text>
    <text x="64" y="242" class="t muted" font-size="13">1. Sign in to Larktun Desktop Client</text>
    <text x="64" y="264" class="t muted" font-size="13">2. Open RustDesk (no ID server needed)</text>
    <rect x="64" y="282" width="284" height="44" rx="10" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="78" y="301" class="t muted" font-size="12">Enter target IP in Remote ID box:</text>
    <text x="78" y="319" class="m" font-size="13.5" font-weight="700" style="fill:#0369a1">100.64.0.10 or 192.168.6.10</text>
  </g>

  <g filter="url(#sh)">
    <rect x="46" y="366" width="320" height="194" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="1.8"/>
    <rect x="64" y="384" width="166" height="24" rx="12" fill="#ccfbf1"/>
    <text x="147" y="400" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#0f766e">Phone / Tablet (Optional)</text>
    <text x="64" y="432" class="t" font-size="17" font-weight="750">System VPN + RustDesk App</text>
    <text x="64" y="458" class="t muted" font-size="12.5">• Requires official Tailscale App on mobile</text>
    <text x="64" y="479" class="t muted" font-size="12.5">  (Larktun NoVPN app is app-only tsnet)</text>
    <rect x="64" y="498" width="284" height="44" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="78" y="517" class="t" font-size="12" font-weight="700" style="fill:#0f766e">Simpler mobile alternative:</text>
    <text x="78" y="535" class="t muted" font-size="12">Use Larktun App built-in WebRTC / RDP</text>
  </g>

  <!-- Center -->
  <g filter="url(#sh)">
    <rect x="452" y="148" width="296" height="412" rx="24" fill="url(#tunnel)"/>
    <rect x="514" y="172" width="172" height="28" rx="14" fill="#14b8a6" fill-opacity="0.2" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="600" y="191" text-anchor="middle" class="t" font-size="12.5" font-weight="700" style="fill:#5eead4">LARKTUN TRANSPORT</text>

    <circle cx="600" cy="248" r="30" fill="url(#tealGrad)"/>
    <path d="M588 248 H612 M604 240 L612 248 L604 256 M596 240 L588 248 L596 256" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="600" y="308" text-anchor="middle" class="t white" font-size="21" font-weight="750">Private Direct IP</text>
    <text x="600" y="334" text-anchor="middle" class="t" font-size="13" style="fill:#cbd5e1">WireGuard P2P · Larktun DERP fallback</text>

    <rect x="478" y="360" width="244" height="48" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#334155"/>
    <text x="600" y="381" text-anchor="middle" class="t white" font-size="13.5" font-weight="700">Private Tunnel Port</text>
    <text x="600" y="400" text-anchor="middle" class="m" font-size="12.5" style="fill:#5eead4">TCP 21118 (Direct IP port)</text>

    <rect x="478" y="422" width="244" height="48" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#334155"/>
    <text x="600" y="443" text-anchor="middle" class="t white" font-size="13.5" font-weight="700">No Public Port 21118</text>
    <text x="600" y="462" text-anchor="middle" class="t" font-size="12" style="fill:#cbd5e1">Hidden from internet port scans</text>

    <rect x="478" y="484" width="244" height="52" rx="12" fill="#0ea5e9" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="600" y="506" text-anchor="middle" class="t" font-size="13.5" font-weight="700" style="fill:#7dd3fc">Shares Active Desktop</text>
    <text x="600" y="525" text-anchor="middle" class="t" font-size="12" style="fill:#e0f2fe">Does not lock out the local screen</text>
  </g>

  <!-- Right -->
  <text x="994" y="130" text-anchor="middle" class="t" font-size="17" font-weight="750">2. Target Host (Direct IP Enabled)</text>

  <g filter="url(#sh)">
    <rect x="834" y="148" width="320" height="196" rx="18" class="card"/>
    <rect x="852" y="166" width="136" height="24" rx="12" fill="#e0f2fe"/>
    <text x="920" y="182" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#0369a1">Mode A · Direct Mesh</text>
    <text x="852" y="216" class="t" font-size="17" font-weight="750">Win / Mac / Linux Host</text>
    <text x="852" y="242" class="t muted" font-size="13">1. Enable Direct IP Access in RustDesk</text>
    <text x="852" y="264" class="t muted" font-size="13">2. Set Permanent Password + Larktun</text>
    <rect x="852" y="282" width="284" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="866" y="301" class="t muted" font-size="12">Target Larktun IP &amp; port:</text>
    <text x="866" y="319" class="m" font-size="14" font-weight="700" style="fill:#0369a1">100.64.0.10 : 21118</text>
  </g>

  <g filter="url(#sh)">
    <rect x="834" y="366" width="320" height="194" rx="18" fill="#ffffff" stroke="#fcd34d" stroke-width="1.8"/>
    <rect x="852" y="384" width="144" height="24" rx="12" fill="#fef3c7"/>
    <text x="924" y="400" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#b45309">Mode B · Subnet Route</text>
    <text x="852" y="432" class="t" font-size="17" font-weight="750">Multiple LAN Computers</text>
    <text x="852" y="458" class="t muted" font-size="13">Router advertises 192.168.6.0/24</text>
    <text x="852" y="480" class="t muted" font-size="13">Targets run RustDesk; Larktun optional</text>
    <rect x="852" y="498" width="284" height="44" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text x="866" y="517" class="t muted" font-size="12">Connect using target LAN IP:</text>
    <text x="866" y="535" class="m" font-size="14" font-weight="700" style="fill:#b45309">192.168.6.10 : 21118</text>
  </g>

  <rect x="46" y="592" width="1108" height="54" rx="16" fill="#ffffff" stroke="#dbe5f1" stroke-width="1.5"/>
  <text x="600" y="624" text-anchor="middle" class="t" font-size="13.5" font-weight="600">With default port 21118, enter the IP directly (e.g. 100.64.0.10); use IP:port if you customized the port. Conceptual diagram.</text>
</svg>
