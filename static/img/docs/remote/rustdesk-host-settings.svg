<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">被控端 RustDesk 开启允许 IP 直接访问与固定密码配置示意</title>
  <desc id="desc">分步标注在被控电脑的 RustDesk 设置与安全页面中解锁安全设置、勾选允许 IP 直接访问（TCP 21118）并配置固定密码。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #0f172a; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #475569; }
      .w { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" class="t" font-size="28" font-weight="800">被控端 RustDesk 关键配置（开启 IP 直接访问）</text>
  <text x="600" y="82" text-anchor="middle" class="t muted" font-size="15">在需要被远程控制的电脑上打开 RustDesk → 右上角菜单 → 设置 → 安全（操作界面示意）</text>

  <!-- Left: Mock RustDesk Settings Window -->
  <g filter="url(#sh)">
    <rect x="46" y="108" width="600" height="474" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Titlebar -->
    <rect x="46" y="108" width="600" height="42" rx="18" fill="#f1f5f9"/>
    <rect x="46" y="134" width="600" height="16" fill="#f1f5f9"/>
    <line x1="46" y1="150" x2="646" y2="150" stroke="#e2e8f0"/>
    <circle cx="72" cy="129" r="7" fill="#0284c7"/>
    <text x="90" y="134" class="t" font-size="14" font-weight="750">RustDesk — 设置</text>

    <!-- Left Sidebar inside RustDesk -->
    <rect x="46" y="150" width="136" height="432" fill="#f8fafc"/>
    <line x1="182" y1="150" x2="182" y2="582" stroke="#e2e8f0"/>
    <text x="72" y="186" class="t muted" font-size="13.5">常规</text>
    <rect x="58" y="202" width="112" height="34" rx="8" fill="#dbeafe"/>
    <text x="72" y="224" class="t" font-size="14" font-weight="750" style="fill:#1d4ed8">安全</text>
    <text x="72" y="264" class="t muted" font-size="13.5">网络</text>
    <text x="72" y="298" class="t muted" font-size="13.5">显示</text>
    <text x="72" y="332" class="t muted" font-size="13.5">声音</text>
    <text x="72" y="366" class="t muted" font-size="13.5">账户</text>

    <!-- Right Content Area inside RustDesk -->
    <!-- Step 1: Unlock Banner -->
    <rect x="202" y="168" width="424" height="50" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="226" cy="193" r="12" fill="#d97706"/>
    <text x="226" y="198" text-anchor="middle" class="t w" font-size="12" font-weight="800">1</text>
    <text x="248" y="198" class="t" font-size="13.5" font-weight="700" style="fill:#92400e">解锁安全设置（需管理员授权）</text>
    <rect x="534" y="179" width="78" height="28" rx="6" fill="#2563eb"/>
    <text x="573" y="198" text-anchor="middle" class="t w" font-size="12" font-weight="700">解锁</text>

    <!-- Step 2: Direct IP Access -->
    <rect x="202" y="236" width="424" height="142" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <circle cx="226" cy="264" r="12" fill="#0284c7"/>
    <text x="226" y="269" text-anchor="middle" class="t w" font-size="12" font-weight="800">2</text>
    <text x="248" y="269" class="t" font-size="15" font-weight="750">安全 → IP 直接访问</text>

    <rect x="220" y="286" width="18" height="18" rx="4" fill="#0284c7"/>
    <path d="M224 295 L227 298 L234 291" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="248" y="300" class="t" font-size="14" font-weight="700">允许 IP 直接访问（启用直接 IP 访问）</text>

    <text x="220" y="334" class="t muted" font-size="13">直接 IP 访问端口：</text>
    <rect x="342" y="314" width="108" height="30" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="396" y="334" text-anchor="middle" class="m" font-size="14" font-weight="700" style="fill:#0369a1">21118</text>
    <text x="462" y="334" class="t muted" font-size="12">（默认 TCP 21118）</text>
    <text x="220" y="364" class="t muted" font-size="12">启用后本机直接监听该端口，不再依赖公共 ID/中继服务器</text>

    <!-- Step 3: Permanent Password -->
    <rect x="202" y="396" width="424" height="166" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
    <circle cx="226" cy="424" r="12" fill="#0d9488"/>
    <text x="226" y="429" text-anchor="middle" class="t w" font-size="12" font-weight="800">3</text>
    <text x="248" y="429" class="t" font-size="15" font-weight="750">密码 → 无人值守访问</text>

    <circle cx="228" cy="458" r="7" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="244" y="463" class="t muted" font-size="13">使用一次性密码（需人手动确认）</text>

    <circle cx="228" cy="488" r="7" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
    <circle cx="228" cy="488" r="2.8" fill="#ffffff"/>
    <text x="244" y="493" class="t" font-size="13.5" font-weight="700">使用固定密码（推荐无人值守）</text>

    <rect x="220" y="510" width="218" height="34" rx="8" fill="#0d9488"/>
    <text x="329" y="532" text-anchor="middle" class="t w" font-size="13" font-weight="700">设置固定密码（强密码）</text>
    <text x="450" y="532" class="t muted" font-size="12">至少 10 位含字母数字</text>
  </g>

  <!-- Right Column: Action Cards -->
  <g filter="url(#sh)">
    <rect x="676" y="108" width="478" height="144" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <text x="700" y="140" class="t" font-size="16.5" font-weight="750" style="fill:#b45309">① 先解锁安全设置，且安装为系统服务</text>
    <text x="700" y="168" class="t muted" font-size="13.5">• Windows 建议使用完整安装版（点击「安装」按钮），让</text>
    <text x="714" y="190" class="t muted" font-size="13.5">RustDesk 以系统服务开机自启，这样锁屏与 UAC 弹窗也能控制。</text>
    <text x="700" y="216" class="t muted" font-size="13.5">• 仅绿色免安装运行（未安装服务）时，系统锁屏或管理员</text>
    <text x="714" y="236" class="t muted" font-size="13.5">弹窗界面可能无法点击。</text>

    <rect x="676" y="270" width="478" height="148" rx="18" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="700" y="302" class="t" font-size="16.5" font-weight="750" style="fill:#0369a1">② 勾选「允许 IP 直接访问」与防火墙放行</text>
    <text x="700" y="330" class="t muted" font-size="13.5">• 勾选后，RustDesk 会在本机网卡监听 TCP 21118 端口。</text>
    <text x="700" y="354" class="t muted" font-size="13.5">• Windows 防火墙弹窗请允许 RustDesk 通信，或手动放行</text>
    <text x="714" y="376" class="t muted" font-size="13.5">TCP 21118 入站规则（限私有网络，严禁公网端口映射）。</text>
    <text x="700" y="400" class="t" font-size="13" font-weight="600" style="fill:#0369a1">• 网络页的 ID/中继服务器全部保持留空即可！</text>

    <rect x="676" y="436" width="478" height="146" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="700" y="468" class="t" font-size="16.5" font-weight="750" style="fill:#0f766e">③ macOS / Linux 被控端额外权限</text>
    <text x="700" y="496" class="t muted" font-size="13.5">• macOS：在「系统设置 → 隐私与安全性」为 RustDesk 授</text>
    <text x="714" y="518" class="t muted" font-size="13.5">权「屏幕录制」、「辅助功能」与「完全磁盘访问（按需）」。</text>
    <text x="700" y="544" class="t muted" font-size="13.5">• Linux：推荐使用 X11 桌面会话以获得最稳体验；Wayland</text>
    <text x="714" y="566" class="t muted" font-size="13.5">环境按系统提示授予桌面共享权限。</text>
  </g>

  <!-- Bottom Notice -->
  <rect x="46" y="610" width="1108" height="58" rx="16" fill="#0f172a"/>
  <text x="600" y="644" text-anchor="middle" class="t w" font-size="14.5" font-weight="600">安全提醒：请务必将「固定密码」设为强密码，仅在云雀通私有网络内访问 TCP 21118，切勿在路由器开放公网 21118。</text>
</svg>
