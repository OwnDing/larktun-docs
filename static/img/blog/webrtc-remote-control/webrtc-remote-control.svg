  <text x="84" y="557" font-size="23" font-weight="700">轻量，无广告</text>
  <text x="84" y="591" font-size="16" class="muted">独立 Host · 安装后随时连接</text>
  <text x="450" y="557" font-size="23" font-weight="700">多设备，同时连接</text>
  <text x="450" y="591" font-size="16" class="muted">共享画面 · 一台控制 · 随时接管</text>
  <text x="816" y="557" font-size="23" font-weight="700">自己的私有网络</text>
  <text x="816" y="591" font-size="16" class="muted">无需映射公网远控端口</text>
  <text x="64" y="651" font-size="16" class="muted">功能示意，非产品截图。其他平台的 WebRTC 支持将陆续推出。</text>
