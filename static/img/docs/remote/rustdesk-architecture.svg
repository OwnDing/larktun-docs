<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">云雀通 + RustDesk IP 直接访问连接架构</title>
  <desc id="desc">展示电脑端和移动端通过云雀通私有加密网络，绕开 RustDesk 公共中继与自建服务器，直接使用私有 IP 或子网局域网 IP 访问目标电脑 TCP 21118 端口。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="0.55" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #0f172a; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #475569; }
      .white { fill: #ffffff; }
      .card { fill: #ffffff; stroke: #dbe5f1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1115" cy="90" r="105" fill="#99f6e4" opacity="0.3"/>
  <circle cx="88" cy="600" r="95" fill="#bfdbfe" opacity="0.32"/>

  <text x="600" y="54" text-anchor="middle" class="t" font-size="31" font-weight="800">云雀通 + RustDesk IP 远程直连架构</text>
  <text x="600" y="86" text-anchor="middle" class="t muted" font-size="16.5">无需自建 hbbs / hbbr 中继 · 不依赖公共服务器 · 兼容 Windows 家庭版 / 专业版 / macOS / Linux</text>

  <!-- Connectors -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M366 246 H452" stroke="#0284c7" stroke-dasharray="7 6"/>
    <path d="M366 446 H452" stroke="#0d9488" stroke-dasharray="7 6"/>
    <path d="M748 258 H834" stroke="#0284c7"/>
    <path d="M748 456 H834" stroke="#d97706"/>
  </g>
  <polygon points="452,246 441,240 441,252" fill="#0284c7"/>
  <polygon points="452,446 441,440 441,452" fill="#0d9488"/>
  <polygon points="834,258 823,252 823,264" fill="#0284c7"/>
  <polygon points="834,456 823,450 823,462" fill="#d97706"/>

  <!-- Left Column: Controllers -->
  <text x="206" y="130" text-anchor="middle" class="t" font-size="18" font-weight="750">① 控制端（RustDesk 客户端）</text>

  <g filter="url(#sh)">
    <rect x="46" y="148" width="320" height="196" rx="18" class="card"/>
    <rect x="64" y="166" width="144" height="24" rx="12" fill="#e0f2fe"/>
    <text x="136" y="182" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#0369a1">Windows / macOS / Linux</text>
    <text x="64" y="216" class="t" font-size="18" font-weight="750">电脑端直接按 IP 连接</text>
    <text x="64" y="242" class="t muted" font-size="13.5">1. 登录 Larktun 桌面客户端（系统网卡）</text>
    <text x="64" y="264" class="t muted" font-size="13.5">2. 打开 RustDesk，无需配置 ID 服务器</text>
    <rect x="64" y="282" width="284" height="44" rx="10" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="78" y="301" class="t muted" font-size="12">在「控制远程桌面」输入目标 IP：</text>
    <text x="78" y="319" class="m" font-size="14" font-weight="700" style="fill:#0369a1">100.64.0.10  或  192.168.6.10</text>
  </g>

  <g filter="url(#sh)">
    <rect x="46" y="366" width="320" height="194" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="1.8"/>
    <rect x="64" y="384" width="154" height="24" rx="12" fill="#ccfbf1"/>
    <text x="141" y="400" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#0f766e">手机 / 平板（可选）</text>
    <text x="64" y="432" class="t" font-size="17.5" font-weight="750">系统 VPN 接入 + RustDesk</text>
    <text x="64" y="458" class="t muted" font-size="13">• 需用官方 Tailscale App 接入云雀通</text>
    <text x="64" y="480" class="t muted" font-size="13">  （云雀通 NoVPN App 仅限 App 内生效）</text>
    <rect x="64" y="498" width="284" height="44" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="78" y="517" class="t" font-size="12" font-weight="700" style="fill:#0f766e">手机端更推荐免 VPN 方案：</text>
    <text x="78" y="535" class="t muted" font-size="12">直接用云雀通 App 内置 WebRTC / RDP</text>
  </g>

  <!-- Center Pillar -->
  <g filter="url(#sh)">
    <rect x="452" y="148" width="296" height="412" rx="24" fill="url(#tunnel)"/>
    <rect x="520" y="172" width="160" height="28" rx="14" fill="#14b8a6" fill-opacity="0.2" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="600" y="191" text-anchor="middle" class="t" font-size="13" font-weight="700" style="fill:#5eead4">LARKTUN 私有传输层</text>

    <circle cx="600" cy="248" r="30" fill="url(#tealGrad)"/>
    <path d="M588 248 H612 M604 240 L612 248 L604 256 M596 240 L588 248 L596 256" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="600" y="308" text-anchor="middle" class="t white" font-size="22" font-weight="750">零中继自建 · IP 直连</text>
    <text x="600" y="334" text-anchor="middle" class="t" font-size="13.5" style="fill:#cbd5e1">WireGuard P2P 优先 · 云雀通 DERP 兜底</text>

    <rect x="478" y="360" width="244" height="48" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#334155"/>
    <text x="600" y="381" text-anchor="middle" class="t white" font-size="14" font-weight="700">私有通道直达端口</text>
    <text x="600" y="400" text-anchor="middle" class="m" font-size="13" style="fill:#5eead4">TCP 21118（默认直连端口）</text>

    <rect x="478" y="422" width="244" height="48" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#334155"/>
    <text x="600" y="443" text-anchor="middle" class="t white" font-size="14" font-weight="700">无需公网映射 21118</text>
    <text x="600" y="462" text-anchor="middle" class="t" font-size="12.5" style="fill:#cbd5e1">隐藏被控端口，杜绝公网扫描</text>

    <rect x="478" y="484" width="244" height="52" rx="12" fill="#0ea5e9" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="600" y="506" text-anchor="middle" class="t" font-size="13.5" font-weight="700" style="fill:#7dd3fc">保留本机当前桌面现场</text>
    <text x="600" y="525" text-anchor="middle" class="t" font-size="12" style="fill:#e0f2fe">不踢下本地登录，支持远程协助</text>
  </g>

  <!-- Right Column: Controlled Hosts -->
  <text x="994" y="130" text-anchor="middle" class="t" font-size="18" font-weight="750">② 被控端（开启 IP 直接访问）</text>

  <g filter="url(#sh)">
    <rect x="834" y="148" width="320" height="196" rx="18" class="card"/>
    <rect x="852" y="166" width="114" height="24" rx="12" fill="#e0f2fe"/>
    <text x="909" y="182" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#0369a1">模式 A · 直接组网</text>
    <text x="852" y="216" class="t" font-size="18" font-weight="750">Win / Mac / Linux 电脑</text>
    <text x="852" y="242" class="t muted" font-size="13.5">1. RustDesk 开启「允许 IP 直接访问」</text>
    <text x="852" y="264" class="t muted" font-size="13.5">2. 设置固定密码 + 登录 Larktun 客户端</text>
    <rect x="852" y="282" width="284" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="866" y="301" class="t muted" font-size="12">被控端私有地址与端口：</text>
    <text x="866" y="319" class="m" font-size="14" font-weight="700" style="fill:#0369a1">100.64.0.10 : 21118</text>
  </g>

  <g filter="url(#sh)">
    <rect x="834" y="366" width="320" height="194" rx="18" fill="#ffffff" stroke="#fcd34d" stroke-width="1.8"/>
    <rect x="852" y="384" width="114" height="24" rx="12" fill="#fef3c7"/>
    <text x="909" y="400" text-anchor="middle" class="t" font-size="12" font-weight="700" style="fill:#b45309">模式 B · 子网路由</text>
    <text x="852" y="432" class="t" font-size="18" font-weight="750">内网多台被控电脑</text>
    <text x="852" y="458" class="t muted" font-size="13.5">路由节点转发 192.168.6.0/24 子网</text>
    <text x="852" y="480" class="t muted" font-size="13.5">被控机仅需装 RustDesk，可不装 Larktun</text>
    <rect x="852" y="498" width="284" height="44" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text x="866" y="517" class="t muted" font-size="12">控制端直接输入局域网 IP：</text>
    <text x="866" y="535" class="m" font-size="14" font-weight="700" style="fill:#b45309">192.168.6.10 : 21118</text>
  </g>

  <rect x="46" y="592" width="1108" height="54" rx="16" fill="#ffffff" stroke="#dbe5f1" stroke-width="1.5"/>
  <text x="600" y="624" text-anchor="middle" class="t" font-size="14.5" font-weight="600">默认端口 21118 连接时通常可直接填 IP（如 100.64.0.10）；修改端口后按 IP:端口 填写。架构示意图，非实际产品截图。</text>
</svg>
