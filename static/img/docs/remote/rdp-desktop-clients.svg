<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">Windows mstsc 与 macOS Windows App 填入云雀通 IP 连接示意</title>
  <desc id="desc">左右并排展示在 Windows 远程桌面连接（mstsc）和 macOS Windows App 中填写云雀通私有 IP 发起 RDP 连接的关键字段。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #0f172a; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" class="t" font-size="28" font-weight="800">电脑控制端连接微软 RDP 示意（填入云雀通私有 IP）</text>
  <text x="600" y="84" text-anchor="middle" class="t muted" font-size="15.5">请先确认本机已登录 Larktun 桌面客户端且状态为「已连接」（操作界面示意）</text>

  <!-- Left Window: Windows mstsc -->
  <g filter="url(#sh)">
    <rect x="48" y="114" width="530" height="456" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Window Titlebar -->
    <rect x="48" y="114" width="530" height="44" rx="16" fill="#f8fafc"/>
    <rect x="48" y="142" width="530" height="16" fill="#f8fafc"/>
    <line x1="48" y1="158" x2="578" y2="158" stroke="#e2e8f0"/>
    <rect x="68" y="127" width="18" height="18" rx="4" fill="#2563eb"/>
    <text x="96" y="141" class="t" font-size="14" font-weight="700">远程桌面连接（Win + R 输入 mstsc）</text>

    <!-- Blue Banner -->
    <rect x="48" y="158" width="530" height="58" fill="#1d4ed8"/>
    <text x="74" y="195" class="t" font-size="22" font-weight="750" style="fill:#ffffff">远程桌面连接</text>
    <rect x="424" y="173" width="132" height="28" rx="14" fill="#ffffff" fill-opacity="0.18"/>
    <text x="490" y="192" text-anchor="middle" class="t" font-size="12.5" font-weight="700" style="fill:#e0f2fe">Windows 控制端</text>

    <!-- Tabs -->
    <rect x="70" y="232" width="64" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="102" y="252" text-anchor="middle" class="t" font-size="13" font-weight="700" style="fill:#1d4ed8">常规</text>
    <text x="164" y="252" class="t muted" font-size="13">显示</text>
    <text x="220" y="252" class="t muted" font-size="13">本地资源</text>
    <text x="296" y="252" class="t muted" font-size="13">体验</text>

    <!-- Form Box -->
    <rect x="70" y="272" width="486" height="222" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="90" y="302" class="t" font-size="14" font-weight="700">计算机(C)：</text>
    <rect x="190" y="282" width="346" height="34" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="204" y="304" class="m" font-size="15" font-weight="700" style="fill:#1d4ed8">100.64.0.10</text>
    <text x="190" y="332" class="t muted" font-size="11">直连填 100.x.x.x · 子网填 192.168.6.10 · 自定义端口写 IP:端口</text>

    <text x="90" y="368" class="t" font-size="14" font-weight="700">用户名(U)：</text>
    <rect x="190" y="348" width="346" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="204" y="370" class="m" font-size="14" style="fill:#334155">alex  （或 MicrosoftAccount\邮箱）</text>

    <!-- Checkbox -->
    <rect x="190" y="398" width="18" height="18" rx="4" fill="#2563eb"/>
    <path d="M194 407 L197 410 L204 403" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="216" y="412" class="t" font-size="13.5">允许我保存凭据（免每次重复输入密码）</text>

    <!-- Tip inside -->
    <rect x="90" y="432" width="446" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="104" y="459" class="t" font-size="11.8" style="fill:#1e40af">提示：点左下角「显示选项」可展开用户名、另存为 .rdp 桌面快捷方式</text>

    <!-- Bottom buttons -->
    <rect x="352" y="514" width="104" height="36" rx="8" fill="#2563eb"/>
    <text x="404" y="537" text-anchor="middle" class="t" font-size="14" font-weight="700" style="fill:#ffffff">连接(N)</text>
    <rect x="468" y="514" width="88" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="512" y="537" text-anchor="middle" class="t muted" font-size="14" font-weight="600">取消</text>
  </g>

  <!-- Right Window: macOS Windows App -->
  <g filter="url(#sh)">
    <rect x="622" y="114" width="530" height="456" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- macOS Titlebar -->
    <rect x="622" y="114" width="530" height="44" rx="16" fill="#f8fafc"/>
    <rect x="622" y="142" width="530" height="16" fill="#f8fafc"/>
    <line x1="622" y1="158" x2="1152" y2="158" stroke="#e2e8f0"/>
    <circle cx="646" cy="136" r="6" fill="#fb7185"/>
    <circle cx="666" cy="136" r="6" fill="#fbbf24"/>
    <circle cx="686" cy="136" r="6" fill="#34d399"/>
    <text x="708" y="141" class="t" font-size="14" font-weight="700">Windows App（macOS · 添加 PC）</text>

    <!-- App Banner -->
    <rect x="622" y="158" width="530" height="58" fill="#0f172a"/>
    <text x="648" y="195" class="t" font-size="21" font-weight="750" style="fill:#ffffff">Add PC · 添加远程电脑</text>
    <rect x="984" y="173" width="146" height="28" rx="14" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="1057" y="192" text-anchor="middle" class="t" font-size="12.5" font-weight="700" style="fill:#7dd3fc">macOS 控制端</text>

    <!-- Form Fields -->
    <rect x="644" y="238" width="486" height="256" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

    <text x="664" y="268" class="t" font-size="13.5" font-weight="700">PC name（电脑名称 / IP）：</text>
    <rect x="664" y="278" width="446" height="36" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="678" y="301" class="m" font-size="15" font-weight="700" style="fill:#1d4ed8">100.64.0.10</text>

    <text x="664" y="342" class="t" font-size="13.5" font-weight="700">User account（用户账户）：</text>
    <rect x="664" y="352" width="446" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="678" y="375" class="t" font-size="13.5" style="fill:#334155">Add User Account → 填入目标 Windows 用户名和密码</text>

    <text x="664" y="416" class="t" font-size="13.5" font-weight="700">Friendly name（备注名，可选）：</text>
    <rect x="664" y="426" width="446" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="678" y="449" class="t muted" font-size="13.5">办公室 Windows 主机</text>

    <text x="664" y="482" class="t muted" font-size="12">在「Display」页签可开启高分屏缩放；在「Folders」页签可挂载 Mac 本地目录</text>

    <!-- Bottom buttons -->
    <rect x="936" y="514" width="96" height="36" rx="8" fill="#2563eb"/>
    <text x="984" y="537" text-anchor="middle" class="t" font-size="14" font-weight="700" style="fill:#ffffff">Add</text>
    <rect x="1044" y="514" width="86" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="1087" y="537" text-anchor="middle" class="t muted" font-size="14" font-weight="600">Cancel</text>
  </g>

  <text x="600" y="610" text-anchor="middle" class="t muted" font-size="14">首次连接弹出「无法验证此远程计算机的身份」证书提醒属正常现象（Windows 自签名 RDP 证书），核对目标 IP 无误后点击「继续 / 是」即可。</text>
</svg>
