<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">控制端 RustDesk 输入云雀通 IP 发起远程连接示意</title>
  <desc id="desc">展示在控制端 RustDesk 界面输入云雀通私有 IP（100.64.0.10）或子网 IP（192.168.6.10），并输入固定密码建立远程桌面的过程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #0f172a; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #475569; }
      .w { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" class="t" font-size="28" font-weight="800">控制端 RustDesk 输入 IP 发起远程连接</text>
  <text x="600" y="82" text-anchor="middle" class="t muted" font-size="15">先确认本机云雀通客户端已连接、目标设备在线，再打开 RustDesk 输入目标 IP（操作界面示意）</text>

  <!-- Step 1: RustDesk Home Input -->
  <g filter="url(#sh)">
    <rect x="46" y="112" width="560" height="422" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="46" y="112" width="560" height="44" rx="18" fill="#f8fafc"/>
    <rect x="46" y="140" width="560" height="16" fill="#f8fafc"/>
    <line x1="46" y1="156" x2="606" y2="156" stroke="#e2e8f0"/>
    <circle cx="72" cy="134" r="7" fill="#0284c7"/>
    <text x="90" y="139" class="t" font-size="14" font-weight="750">RustDesk 主界面（控制端）</text>

    <!-- Control Remote Desktop Box -->
    <text x="72" y="192" class="t" font-size="16" font-weight="750">控制远程桌面</text>
    <rect x="72" y="206" width="508" height="52" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.2"/>
    <text x="90" y="238" class="m" font-size="19" font-weight="750" style="fill:#0369a1">100.64.0.10</text>
    <rect x="518" y="214" width="52" height="36" rx="8" fill="#0284c7"/>
    <text x="544" y="238" text-anchor="middle" class="t w" font-size="18" font-weight="800">→</text>

    <!-- Format examples -->
    <rect x="72" y="276" width="508" height="122" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="90" y="302" class="t" font-size="13.5" font-weight="750">支持以下三种输入格式：</text>
    <text x="90" y="328" class="m" font-size="13.5" font-weight="700" style="fill:#0369a1">100.64.0.10</text>
    <text x="268" y="328" class="t muted" font-size="13">直接组网（默认 21118 端口）</text>
    <text x="90" y="354" class="m" font-size="13.5" font-weight="700" style="fill:#4f46e5">100.64.0.10:21118</text>
    <text x="268" y="354" class="t muted" font-size="13">显式指定或自定义直连端口</text>
    <text x="90" y="380" class="m" font-size="13.5" font-weight="700" style="fill:#b45309">192.168.6.10</text>
    <text x="268" y="380" class="t muted" font-size="13">已批准子网路由内的局域网 IP</text>

    <!-- Recent Sessions -->
    <text x="72" y="428" class="t muted" font-size="13" font-weight="700">最近会话 / 收藏（连过一次可双击复连）</text>
    <rect x="72" y="442" width="244" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="86" y="456" width="38" height="28" rx="6" fill="#0f172a"/>
    <text x="136" y="472" class="t" font-size="13.5" font-weight="700">家里电脑 (Win 家庭版)</text>
    <text x="136" y="492" class="m muted" font-size="12">100.64.0.10</text>

    <rect x="336" y="442" width="244" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="350" y="456" width="38" height="28" rx="6" fill="#1e3a8a"/>
    <text x="400" y="472" class="t" font-size="13.5" font-weight="700">办公室主机 (子网)</text>
    <text x="400" y="492" class="m muted" font-size="12">192.168.6.10</text>
  </g>

  <!-- Arrow between windows -->
  <path d="M622 323 H674" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="682,323 668,315 668,331" fill="#0284c7"/>

  <!-- Step 2: Password Dialog & Tips -->
  <g filter="url(#sh)">
    <rect x="692" y="112" width="462" height="252" rx="18" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/>
    <rect x="692" y="112" width="462" height="44" rx="18" fill="#f0fdfa"/>
    <rect x="692" y="140" width="462" height="16" fill="#f0fdfa"/>
    <line x1="692" y1="156" x2="1154" y2="156" stroke="#ccfbf1"/>
    <text x="718" y="139" class="t" font-size="14.5" font-weight="750" style="fill:#0f766e">需要密码 — 正在连接 100.64.0.10</text>

    <text x="718" y="190" class="t" font-size="13.5" font-weight="700">请输入被控端 RustDesk 固定密码：</text>
    <rect x="718" y="204" width="410" height="40" rx="8" fill="#f8fafc" stroke="#0d9488" stroke-width="1.8"/>
    <text x="734" y="230" class="m" font-size="16" font-weight="700">••••••••••••••</text>

    <rect x="718" y="260" width="18" height="18" rx="4" fill="#0d9488"/>
    <path d="M722 269 L725 272 L732 265" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="744" y="274" class="t" font-size="13.5">记住密码（个人可信设备勾选）</text>

    <rect x="942" y="306" width="94" height="36" rx="8" fill="#0d9488"/>
    <text x="989" y="329" text-anchor="middle" class="t w" font-size="14" font-weight="700">确认</text>
    <rect x="1046" y="306" width="82" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="1087" y="329" text-anchor="middle" class="t muted" font-size="14">取消</text>
  </g>

  <!-- Step 3: Post-connect capability card -->
  <g filter="url(#sh)">
    <rect x="692" y="384" width="462" height="150" rx="18" fill="#ffffff" stroke="#dbe5f1" stroke-width="1.5"/>
    <text x="716" y="416" class="t" font-size="16" font-weight="750">连接后的实用体验优化</text>
    <text x="716" y="444" class="t muted" font-size="13.5">• 画面与编解码：顶部工具栏可切「好画质 / 平衡 / 流畅」</text>
    <text x="716" y="468" class="t muted" font-size="13.5">• 文件传输：主界面点 IP 右侧菜单可进入「传输文件」</text>
    <text x="716" y="492" class="t muted" font-size="13.5">• 隐私与多屏：支持切换多显示器、音频传输与剪贴板同步</text>
    <text x="716" y="516" class="t" font-size="13" font-weight="600" style="fill:#0369a1">• 底部绿色盾牌提示端到端加密，流量全程走云雀通内网</text>
  </g>

  <text x="600" y="584" text-anchor="middle" class="t muted" font-size="14">注意：控制端底部状态栏即使提示「未就绪 / 无法连接公共服务器」，只要云雀通在线，IP 直接访问依然可以正常工作！</text>
</svg>
