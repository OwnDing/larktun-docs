  <text x="600" y="425" text-anchor="middle" font-size="16" class="muted">Encryption · Access control</text>
  <rect x="770" y="269" width="350" height="199" rx="14" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <rect x="782" y="281" width="326" height="172" rx="6" fill="#1e293b"/>
  <circle cx="798" cy="296" r="3" fill="#fb7185"/>
  <circle cx="810" cy="296" r="3" fill="#fbbf24"/>
  <circle cx="822" cy="296" r="3" fill="#34d399"/>
  <text x="945" y="338" text-anchor="middle" font-size="27" font-weight="650">Windows / Mac</text>
