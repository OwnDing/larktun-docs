<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">Larktun（云雀通）、Tailscale、EasyTier 异地组网选型对比</title>
  <desc id="desc">对比云雀通 Larktun、Tailscale 和 EasyTier 三款异地组网软件的核心定位与适用场景，三者各有所长，没有绝对好坏。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="larktunBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #f8fafc; }
      .muted { fill: #cbd5e1; }
      .subtle { fill: #94a3b8; }
      .accent { fill: #7dd3fc; }
      .emerald { fill: #6ee7b7; }
      .amber { fill: #fcd34d; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="32" fill="url(#bg)"/>
  <circle cx="1120" cy="70" r="240" fill="#6366f1" opacity=".12"/>
  <circle cx="90" cy="640" r="200" fill="#38bdf8" opacity=".08"/>

  <!-- Top Header -->
  <text x="64" y="70" font-size="19" font-weight="700" class="accent" letter-spacing="1.2">MESH VPN COMPARISON · 异地组网选型指南</text>
  <rect x="936" y="42" width="200" height="38" rx="19" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".45"/>
  <text x="1036" y="67" text-anchor="middle" font-size="16" font-weight="600" class="accent">各有所长 · 按需选型</text>

  <text x="64" y="142" font-size="44" font-weight="750">Larktun vs. Tailscale vs. EasyTier</text>
  <text x="64" y="186" font-size="22" class="muted">没有绝对的好坏，关键看你的网络环境、终端形态与团队治理需求</text>

  <!-- Card 1: Tailscale -->
  <g transform="translate(64, 228)">
    <rect width="336" height="378" rx="22" fill="#ffffff" fill-opacity=".045" stroke="#475569" stroke-width="1.5"/>
    <rect x="24" y="24" width="116" height="30" rx="15" fill="#94a3b8" fill-opacity=".18"/>
    <text x="82" y="44" text-anchor="middle" font-size="14" font-weight="600" class="muted">全球生态标杆</text>
    <text x="24" y="92" font-size="30" font-weight="700">Tailscale</text>
    <text x="24" y="122" font-size="16" class="subtle">WireGuard · 成熟托管控制面</text>
    <line x1="24" y1="144" x2="312" y2="144" stroke="#334155" stroke-width="1"/>

    <text x="24" y="180" font-size="16" class="muted">• 协议与全平台生态极其成熟</text>
    <text x="24" y="214" font-size="16" class="muted">• MagicDNS / Exit Node / SSO 完善</text>
    <text x="24" y="248" font-size="16" class="muted">• 海外与顺畅网络下开箱即用</text>
    <text x="24" y="282" font-size="16" class="subtle">△ 默认中继在海外，国区无 iOS</text>
    <text x="24" y="312" font-size="16" class="subtle">△ 移动端占用系统 VPN 通道</text>

    <rect x="24" y="330" width="288" height="30" rx="8" fill="#1e293b"/>
    <text x="168" y="350" text-anchor="middle" font-size="14" class="muted">适合：海外环境 / 已有 Tailscale 生态</text>
  </g>

  <!-- Card 2: Larktun -->
  <g transform="translate(432, 214)">
    <rect width="336" height="406" rx="22" fill="#1e3a5f" fill-opacity=".42" stroke="url(#larktunBorder)" stroke-width="2.5"/>
    <rect x="24" y="24" width="144" height="30" rx="15" fill="#38bdf8" fill-opacity=".2"/>
    <text x="96" y="44" text-anchor="middle" font-size="14" font-weight="700" class="accent">国内优化 · 一站式远控</text>
    <text x="24" y="92" font-size="30" font-weight="750">Larktun 云雀通</text>
    <text x="24" y="122" font-size="16" class="accent">基于 Tailscale 演进 · SaaS 多租户</text>
    <line x1="24" y1="144" x2="312" y2="144" stroke="#38bdf8" stroke-opacity=".35" stroke-width="1"/>

    <text x="24" y="180" font-size="16">• 内置国内中继，支持专用与自建</text>
    <text x="24" y="214" font-size="16">• 国区 iOS / Android 免 VPN 组网</text>
    <text x="24" y="248" font-size="16">• 内置 WebRTC 远控 / RDP / SSH</text>
    <text x="24" y="282" font-size="16">• 提供 OpenWrt / Linux / NAS 包</text>
    <text x="24" y="316" font-size="16">• 多租户隔离 + 可视化 ACL 治理</text>

    <rect x="24" y="346" width="288" height="38" rx="10" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8" stroke-opacity=".4"/>
    <text x="168" y="370" text-anchor="middle" font-size="14" font-weight="600" class="accent">适合：国内个人、NAS、移动办公与团队</text>
  </g>

  <!-- Card 3: EasyTier -->
  <g transform="translate(800, 228)">
    <rect width="336" height="378" rx="22" fill="#ffffff" fill-opacity=".045" stroke="#475569" stroke-width="1.5"/>
    <rect x="24" y="24" width="128" height="30" rx="15" fill="#34d399" fill-opacity=".16"/>
    <text x="88" y="44" text-anchor="middle" font-size="14" font-weight="600" class="emerald">开源去中心化</text>
    <text x="24" y="92" font-size="30" font-weight="700">EasyTier</text>
    <text x="24" y="122" font-size="16" class="subtle">Rust 实现 · 多协议 Mesh 组网</text>
    <line x1="24" y1="144" x2="312" y2="144" stroke="#334155" stroke-width="1"/>

    <text x="24" y="180" font-size="16" class="muted">• 完全开源去中心化，免注册入网</text>
    <text x="24" y="214" font-size="16" class="muted">• TCP / KCP / QUIC 穿透力强</text>
    <text x="24" y="248" font-size="16" class="muted">• 轻量易自建中继与多跳 Mesh</text>
    <text x="24" y="282" font-size="16" class="subtle">△ 专注网络层，远控需第三方工具</text>
    <text x="24" y="312" font-size="16" class="subtle">△ 无多租户面板，国区无 iOS</text>

    <rect x="24" y="330" width="288" height="30" rx="8" fill="#1e293b"/>
    <text x="168" y="350" text-anchor="middle" font-size="14" class="muted">适合：极客自建 / 严苛 NAT / 纯开源</text>
  </g>

  <!-- Bottom note -->
  <text x="64" y="650" font-size="15" class="subtle">docs.larktun.com · 异地组网与零信任远程访问选型参考</text>
</svg>
