<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" xml:lang="en-US" role="img" aria-labelledby="title desc">
  <title id="title">RustDesk Host Settings for Direct IP Access and Permanent Password</title>
  <desc id="desc">Annotated UI illustration showing how to unlock security settings, enable Direct IP Access on TCP 21118, and set a strong permanent password on the target PC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #475569; }
      .w { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" class="t" font-size="27" font-weight="800">Target Host Setup in RustDesk (Enable Direct IP Access)</text>
  <text x="600" y="82" text-anchor="middle" class="t muted" font-size="14.5">On the computer to be controlled, open RustDesk → Menu → Settings → Security (UI illustration)</text>

  <!-- Left Window -->
  <g filter="url(#sh)">
    <rect x="46" y="108" width="600" height="474" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="46" y="108" width="600" height="42" rx="18" fill="#f1f5f9"/>
    <rect x="46" y="134" width="600" height="16" fill="#f1f5f9"/>
    <line x1="46" y1="150" x2="646" y2="150" stroke="#e2e8f0"/>
    <circle cx="72" cy="129" r="7" fill="#0284c7"/>
    <text x="90" y="134" class="t" font-size="14" font-weight="750">RustDesk — Settings</text>

    <rect x="46" y="150" width="136" height="432" fill="#f8fafc"/>
    <line x1="182" y1="150" x2="182" y2="582" stroke="#e2e8f0"/>
    <text x="70" y="186" class="t muted" font-size="13.5">General</text>
    <rect x="58" y="202" width="112" height="34" rx="8" fill="#dbeafe"/>
    <text x="70" y="224" class="t" font-size="14" font-weight="750" style="fill:#1d4ed8">Security</text>
    <text x="70" y="264" class="t muted" font-size="13.5">Network</text>
    <text x="70" y="298" class="t muted" font-size="13.5">Display</text>
    <text x="70" y="332" class="t muted" font-size="13.5">Audio</text>
    <text x="70" y="366" class="t muted" font-size="13.5">Account</text>

    <!-- Step 1 -->
    <rect x="202" y="168" width="424" height="50" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="226" cy="193" r="12" fill="#d97706"/>
    <text x="226" y="198" text-anchor="middle" class="t w" font-size="12" font-weight="800">1</text>
    <text x="248" y="198" class="t" font-size="13" font-weight="700" style="fill:#92400e">Unlock security settings (admin auth)</text>
    <rect x="534" y="179" width="78" height="28" rx="6" fill="#2563eb"/>
    <text x="573" y="198" text-anchor="middle" class="t w" font-size="12" font-weight="700">Unlock</text>

    <!-- Step 2 -->
    <rect x="202" y="236" width="424" height="142" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <circle cx="226" cy="264" r="12" fill="#0284c7"/>
    <text x="226" y="269" text-anchor="middle" class="t w" font-size="12" font-weight="800">2</text>
    <text x="248" y="269" class="t" font-size="14.5" font-weight="750">Security → Direct IP Access</text>

    <rect x="220" y="286" width="18" height="18" rx="4" fill="#0284c7"/>
    <path d="M224 295 L227 298 L234 291" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="248" y="300" class="t" font-size="14" font-weight="700">Enable direct IP access</text>

    <text x="220" y="334" class="t muted" font-size="13">Direct IP access port:</text>
    <rect x="366" y="314" width="96" height="30" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="414" y="334" text-anchor="middle" class="m" font-size="14" font-weight="700" style="fill:#0369a1">21118</text>
    <text x="472" y="334" class="t muted" font-size="12">(Default TCP)</text>
    <text x="220" y="364" class="t muted" font-size="12">Listens locally on port 21118 without using public relay servers</text>

    <!-- Step 3 -->
    <rect x="202" y="396" width="424" height="166" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
    <circle cx="226" cy="424" r="12" fill="#0d9488"/>
    <text x="226" y="429" text-anchor="middle" class="t w" font-size="12" font-weight="800">3</text>
    <text x="248" y="429" class="t" font-size="14.5" font-weight="750">Password → Unattended Access</text>

    <circle cx="228" cy="458" r="7" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="244" y="463" class="t muted" font-size="13">Use one-time password</text>

    <circle cx="228" cy="488" r="7" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
    <circle cx="228" cy="488" r="2.8" fill="#ffffff"/>
    <text x="244" y="493" class="t" font-size="13.5" font-weight="700">Use permanent password (recommended)</text>

    <rect x="220" y="510" width="218" height="34" rx="8" fill="#0d9488"/>
    <text x="329" y="532" text-anchor="middle" class="t w" font-size="13" font-weight="700">Set permanent password</text>
    <text x="450" y="532" class="t muted" font-size="12">Use a strong password</text>
  </g>

  <!-- Right Column -->
  <g filter="url(#sh)">
    <rect x="676" y="108" width="478" height="144" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <text x="700" y="140" class="t" font-size="16" font-weight="750" style="fill:#b45309">1. Unlock Settings &amp; Install System Service</text>
    <text x="700" y="168" class="t muted" font-size="13">• On Windows, click Install inside RustDesk so it runs as a</text>
    <text x="712" y="189" class="t muted" font-size="13">system service at boot and handles lock screens / UAC prompts.</text>
    <text x="700" y="214" class="t muted" font-size="13">• Portable-only mode cannot interact with UAC elevation dialogs</text>
    <text x="712" y="234" class="t muted" font-size="13">or sign-in screens after reboot.</text>

    <rect x="676" y="270" width="478" height="148" rx="18" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="700" y="302" class="t" font-size="16" font-weight="750" style="fill:#0369a1">2. Enable Direct IP &amp; Allow Firewall Port</text>
    <text x="700" y="330" class="t muted" font-size="13">• Once checked, RustDesk listens on local TCP port 21118.</text>
    <text x="700" y="354" class="t muted" font-size="13">• Allow RustDesk through the OS firewall (or allow TCP 21118</text>
    <text x="712" y="375" class="t muted" font-size="13">on private/Larktun profiles — never forward publicly).</text>
    <text x="700" y="400" class="t" font-size="12.5" font-weight="600" style="fill:#0369a1">• Leave Network ID / Relay server fields completely blank!</text>

    <rect x="676" y="436" width="478" height="146" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="700" y="468" class="t" font-size="16" font-weight="750" style="fill:#0f766e">3. Extra Permissions on macOS / Linux</text>
    <text x="700" y="496" class="t muted" font-size="13">• macOS: grant Screen Recording and Accessibility to RustDesk</text>
    <text x="712" y="517" class="t muted" font-size="13">in System Settings → Privacy &amp; Security.</text>
    <text x="700" y="543" class="t muted" font-size="13">• Linux: X11 offers the smoothest unattended support; on</text>
    <text x="712" y="564" class="t muted" font-size="13">Wayland, approve desktop portal sharing as prompted.</text>
  </g>

  <rect x="46" y="610" width="1108" height="58" rx="16" fill="#0f172a"/>
  <text x="600" y="644" text-anchor="middle" class="t w" font-size="13.5" font-weight="600">Security: Always set a strong permanent password, keep TCP 21118 strictly inside your Larktun network, and never expose port 21118 publicly.</text>
</svg>
