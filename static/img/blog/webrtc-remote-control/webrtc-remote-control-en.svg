<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">Your desktop. Wherever you are.</title>
  <desc id="desc">Larktun WebRTC official release feature illustration, not a product screenshot. iPhone and iPad connect to Windows or Mac over a private network, with one device controlling at a time.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <style>text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#f8fafc} .muted {fill:#cbd5e1} .accent {fill:#7dd3fc}</style>
  </defs>
  <rect width="1200" height="680" rx="32" fill="url(#bg)"/>
  <circle cx="1120" cy="60" r="240" fill="#6366f1" opacity=".12"/>
  <text x="64" y="72" font-size="21" font-weight="700" class="accent">LARKTUN / WEBRTC REMOTE</text>
  <rect x="954" y="43" width="182" height="40" rx="20" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".5"/>
  <text x="1045" y="69" text-anchor="middle" font-size="17" font-weight="700" style="fill:#6ee7b7">OUT OF BETA</text>
  <text x="64" y="150" font-size="48" font-weight="750">Your desktop. Wherever you are.</text>
  <text x="64" y="196" font-size="23" class="muted">Lightweight. Ad-free. Windows / macOS hosts. iPhone / iPad clients.</text>
